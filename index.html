<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Asset SNNP</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1426;--mut:#3f485c;--line:#c3cbdb;--bg:#f2f5fa;--card:#fff;--acc:#1d4ed8;--hi:#1d4ed8;--ok:#15803d;--err:#b91c1c;--teal:#0f766e;--amb:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--ink);color:#fff;padding:14px 18px;font-weight:600;font-size:18px}
main{max-width:1400px;margin:0;padding:14px}
.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.bars{flex:1 1 0;min-width:0}
.modes{display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex:0 0 auto}
.modes button{flex:0 0 auto;width:120px;padding:6px 12px;border:2px solid var(--ink);background:#fff;font:inherit;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--ink);text-align:left}
.modes button.on{background:var(--hi);border-color:var(--hi);color:#fff}
.bar[hidden]{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.bar>*{flex:1 1 180px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.in{display:flex;gap:6px}
.ic{flex:0 0 44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.ic.rec{background:var(--err);color:#fff}
.grid[hidden],.list[hidden]{display:none}
.grid.one{grid-template-columns:minmax(0,1fr)!important}
.fld{flex:1 1 220px}
.fld[hidden]{display:none}
#assetbar{margin-bottom:10px}
#left{min-width:0}
.fld>label{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:5px}
.bar .fld{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#bar2 .fld{background:var(--hi);border-color:#0a1f63}
#bar2 .fld>label{color:#fff}
input[readonly]{background:#eef0f4;color:var(--mut)}
select:disabled{background:#eef0f4}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:641px){.grid{grid-template-columns:340px minmax(0,1fr)}}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:70vh;overflow:auto}
.list .head{padding:8px 12px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.it{padding:5px 12px;line-height:1.3;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:#eef3ff}.it.sel{background:#f8cbad;color:var(--ink)}.it.sel span{color:var(--mut)}
.it b{display:block}.it span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.empty{color:var(--mut);padding:30px;text-align:center}
.ttl{font-size:18px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.sec{background:#a9d08e;color:var(--ink);padding:6px 10px;font-weight:600;border-radius:6px;margin:16px 0 10px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.chg input{border-color:var(--acc);background:#f1f5ff}
.chk{border:2px solid #2563eb;background:#e8f1ff;border-radius:10px;padding:6px 10px 10px}
.chk>label{color:#12308f;font-weight:600}
.savebox{flex:0 0 auto!important;align-self:center;position:relative;display:flex}
.savebox button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
#msg{position:absolute;right:0;top:100%;margin-top:4px;font-size:13px;white-space:nowrap}
.savebox{gap:6px}
.savebox button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
#hist{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
#hist .box{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column}
#hist .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
#hist .hd button{border:0;background:none;font-size:20px;cursor:pointer}
#hist .bd{overflow:auto;padding:0 16px 12px}
#hist table{border-collapse:collapse;width:100%;font-size:14px}
#hist th,#hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#hist th{position:sticky;top:0;background:#fff;color:var(--mut);font-weight:500}
.old{color:var(--err);text-decoration:line-through}.new{color:var(--ok)}
.savebox button:disabled{opacity:.5;cursor:default}
#msg{font-weight:500}.ok{color:var(--ok)}.bad{color:var(--err)}
#cam{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9}
#cam video{max-width:92vw;max-height:70vh;border-radius:10px}
#cam button{padding:10px 24px;border-radius:8px;border:0;font:inherit}

/* ปรับขนาดแถบตัวเลือกให้กะทัดรัด (เดสก์ท็อป) */
@media(min-width:641px){
  .bar{gap:6px;margin-bottom:10px}
  .bar>*{flex:1 1 140px}
  .bar .fld{padding:5px 8px;border-radius:8px}
  .fld>label{font-size:12px;margin-bottom:2px}
  .bar select,.bar input{font-size:13px;padding:5px 8px;border-radius:6px}
  .ic{flex:0 0 34px;font-size:15px;border-radius:6px}
  .savebox button{padding:6px 12px;font-size:13px;border-radius:6px}
}

/* ตัวกรอง (โหมดที่ 3) */
#bar3 .fld{flex:1 1 100%;min-width:0}
.fh{display:flex;justify-content:flex-start;align-items:center;margin-bottom:8px;font-weight:600}
.fh button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
#fwrap{display:flex;flex-direction:column;gap:14px}
#fbox,#fres{min-width:0}
#fres .grid{grid-template-columns:minmax(0,1fr)}
#fres .list{max-height:32vh}
@media(min-width:641px){
  #fwrap{flex-direction:row;align-items:flex-start}
  #fbox{flex:0 0 auto;max-width:45%}
  #fres{flex:1 1 0}
}
.fx{margin-top:6px}
.fx button{background:#15803d;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.fx button:disabled{opacity:.45;cursor:default}
.fg{margin-bottom:10px}
.fg>b{display:inline-block;font-size:14px;margin-bottom:8px;padding:6px 16px;background:#e1ecff;color:#12308f;border:2px solid #9ec5fe;border-radius:8px;font-weight:600}
.fo{display:flex;flex-wrap:wrap;gap:6px 16px;max-height:120px;overflow:auto}
.fo label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.fo input{width:18px;height:18px;padding:0;accent-color:var(--acc)}

@media(max-width:640px){
  body{font-size:16px}
  header{padding:12px 14px;font-size:17px}
  main{padding:10px}
  input,select{font-size:16px;padding:12px}
  .top{flex-direction:column;gap:8px}.bars{width:100%;flex:none}
  .modes{flex-direction:row;width:100%;gap:6px}.modes button{flex:1;width:auto;min-width:0;padding:9px 6px;font-size:14px;text-align:center}
  .bar{gap:6px;margin-bottom:10px}
  #bar1 .fld{flex:1 1 calc(33.333% - 4px);min-width:0;padding:6px 8px;border-radius:8px}
  #bar2 .fld{flex:1 1 100%;padding:6px 8px}
  .fld>label{font-size:12px;margin-bottom:3px}
  .bar select,.bar input{font-size:14px;padding:7px 8px}
  .fo input{width:18px;height:18px;padding:0}
  .fo{flex-wrap:nowrap;gap:8px;max-height:none;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .fo::-webkit-scrollbar{height:6px}
  .fo::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .fo label{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}
  .fo label:has(input:checked){background:#e8f1ff;border-color:var(--acc);font-weight:600;color:var(--acc)}
  .bar .ic{flex:0 0 40px;font-size:16px}
  .savebox{flex:1 1 100%!important;align-self:stretch;gap:6px}
  .savebox button{flex:1;padding:8px;font-size:14px}
  #msg{position:static;margin:0;align-self:center;white-space:normal;flex:1}
  .list{max-height:38vh}
  .it{padding:8px 12px}
  .panel{padding:12px}
  .f{grid-template-columns:1fr}
  .ic{flex:0 0 48px}
  #hist{padding:0;align-items:flex-end}
  #hist .box{max-width:none;border-radius:14px 14px 0 0;max-height:88vh}
  #hist th:nth-child(4),#hist td:nth-child(4){display:none}
  #hist table{font-size:13px}
}
/* ปรับให้เล็กลงอีก: ปุ่มและตัวอักษรของตัวกรอง/ปุ่มบันทึก (ทุกหน้าจอ) */
.fh{margin-bottom:6px}
.fh button{padding:3px 10px;font-size:12px;border-radius:6px}
.fg{margin-bottom:6px}
.fg>b{font-size:12px;padding:2px 10px;margin-bottom:4px;border-width:1px;border-radius:6px}
.fo{gap:4px 12px}
.fo label{font-size:12px;gap:4px}
.fo input{width:14px;height:14px}
.fx button{padding:5px 12px;font-size:12px;border-radius:6px}
.savebox button{padding:5px 12px;font-size:12px;border-radius:6px}
#msg{font-size:12px}
@media(max-width:640px){
  .fo{gap:6px}
  .fo label{padding:3px 8px}
  .fo input{width:14px;height:14px}
  .savebox button{padding:6px;font-size:12px}
  .it{padding:5px 12px}
}
/* ปุ่ม Save / ประวัติ ต่อจากปุ่ม Filter */
.modes .savebox{flex:0 0 auto!important;align-self:flex-start;width:120px;flex-direction:column;align-items:stretch;gap:6px;margin-top:4px}
.modes .savebox button{width:100%;text-align:center;border:0}
.modes .savebox button.alt{border:1px solid var(--line)}
.modes #msg{position:static;margin:0;white-space:normal;text-align:center}
@media(max-width:640px){
  .modes{flex-wrap:wrap}
  .modes .savebox{flex:1 1 100%!important;width:100%;flex-direction:row;align-items:center;margin-top:0}
  .modes .savebox button{flex:1;width:auto}
  .modes #msg{flex:1 1 100%}
}
/* ช่องเลือกจากรายการหรือพิมพ์เพิ่มเอง (Product Key, ผู้ถือครอง) */
.cb{position:relative}
.cb input{width:100%;padding-right:26px}
.cbb{position:absolute;right:1px;top:1px;bottom:1px;width:24px;border:0;border-left:1px solid var(--line);background:#eef0f4;color:var(--ink);border-radius:0 5px 5px 0;cursor:pointer;font-size:12px;padding:0}
.cbl{position:absolute;left:0;right:0;top:100%;z-index:30;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:2px}
.cbl .o{padding:6px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid #eef0f4;word-break:break-all}
.cbl .o:hover{background:#eef3ff}
.cbl .no{padding:6px 10px;font-size:12px;color:var(--mut)}
#xl{background:#15803d!important;color:#fff}
#xl:disabled{opacity:.45}
/* ทุกโหมดบนคอม: รายการย่อให้สั้น, Software/Hardware อยู่ข้างรายการ */
@media(min-width:641px){
  #grid.grid{grid-template-columns:240px minmax(0,1fr);grid-template-areas:"list p1";gap:8px;align-items:start}
  #grid #left{grid-area:list;position:sticky;top:8px}
  #grid #panel{grid-area:p1}
  #grid #panel2{display:none}
  #grid .list{max-height:calc(100vh - 16px)}
  #fres .list{height:calc(100vh - 16px)}
  #grid .head{padding:4px 10px;font-size:12px}
  #grid .it{padding:5px 10px}
  #grid .it b{font-size:13px}
  #grid .it span{font-size:12px}
  #grid .panel{padding:10px 12px}
  #grid .ttl{font-size:14px;display:inline}
  #grid .sub{display:inline;margin:0 0 4px 8px;font-size:13px}
  #grid #panel .sec{padding:2px 8px;margin:8px 0 5px;font-size:13px;border-radius:5px}
  #grid #panel .f{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px 8px}
  #grid #panel label{font-size:11px;margin-bottom:1px;line-height:1.2}
  #grid #panel input,#grid #panel select{padding:3px 6px;font-size:12px;border-radius:5px;height:26px}
  #grid #panel .chk{padding:3px 6px 5px;border-width:1px;border-radius:6px}
  #grid #panel .chk>label{font-size:11px}
  #grid #panel2 .sec:first-child{margin-top:0}
}
/* สรุปจำนวน (ใต้ปุ่ม Save/ประวัติ) */
#stats{width:150px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
#stats .r{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid #eef0f4}
#stats .r{white-space:nowrap}
#stats .r,#stats .r b,#stats .r.s,#stats .r.s b{color:#0033ff;font-weight:700}
#stats .r:last-child{border-bottom:0}
#stats .r b{font-size:15px;color:var(--acc)}
#stats .r.s{padding-left:10px;color:var(--mut)}
#stats .r.s b{font-size:13px;color:var(--ink)}
@media(max-width:640px){#stats{width:100%;flex:1 1 100%}}
@supports(padding:max(0px)){main{padding-bottom:max(14px,env(safe-area-inset-bottom))}}

.fg>b label{display:inline;margin:0;font-size:inherit;color:inherit;font-weight:inherit;cursor:pointer}
.fg>b input{width:18px;height:18px;padding:0;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--acc)}
.fsec{background:#a9d08e;color:var(--ink);padding:5px 10px;font-weight:700;border-radius:6px;margin:14px 0 10px;font-size:14.5px}
/* ปรับความคมชัด/อ่านง่าย */
html{-webkit-text-size-adjust:100%}
body{font-size:17px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:0}
input,select,button,textarea{font-family:inherit;color:var(--ink)}
input,select{font-size:16px;line-height:1.4;border-color:#aeb8cc}
label{font-size:14px;color:var(--mut);font-weight:500;margin-bottom:4px}
.fld>label{font-size:14.5px;font-weight:600}
#bar2 .fld>label{color:#fff}
.it span,.list .head,.sub{font-size:14px}
.it b{font-weight:600;font-size:15.5px}
.ttl{font-size:20px;font-weight:700}
.sec{font-weight:700;font-size:15.5px}
header{font-weight:700;font-size:19px;letter-spacing:.2px}
.modes button{font-size:14px}

  .fld>label,label{font-size:13.5px}
  .bar select,.bar input{font-size:15px}
  #hist table{font-size:14px}
}
/* ปุ่ม Reset All (ใต้สรุปจำนวน) */
.modes .savebox #rf{width:100%;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;background:#fff;color:var(--acc);border:2px solid var(--acc);border-radius:6px;cursor:pointer}
.modes .savebox #rf:hover{background:var(--acc);color:#fff}
.modes .savebox #rf:disabled{opacity:.5;cursor:default}
.modes .savebox #rs{width:100%;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;background:#fff;color:var(--err);border:2px solid var(--err);border-radius:6px;cursor:pointer}
.modes .savebox #rs:hover{background:var(--err);color:#fff}
/* ขยายช่อง Product Key (2 ช่อง) และ หมายเหตุ (เต็มแถว) */
.f>.wfull{grid-column:1/-1}

/* ช่องสรุปจำนวน: หัวข้อสีน้ำเงิน รายการย่อย (-) สีดำ */
#stats{width:175px}

@media(max-width:640px){
  .asw .awh{display:none}
  .asw .awr{grid-template-columns:minmax(0,1fr) 40px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .asw .awr .aw-n{grid-column:1/2}.asw .awr .aw-l{grid-column:1/2}
  .asw .awr .awx{grid-column:2/3;grid-row:1/3;height:100%}
}
/* ช่องหมายเหตุ ความกว้างครึ่งหนึ่งของแถว */
.f>.wfull{width:50%}
@media(max-width:640px){.f>.wfull{width:100%}}

.fsel{width:100%;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px}
/* ซ่อนป้ายชื่อซ้ำของ Additional Software และ หมายเหตุ (มีหัวแถบสีเขียวอยู่แล้ว) */
.f>.wfull>label{display:none}
#fclr{background:var(--hi);border-color:var(--hi);color:#fff;font-weight:600}
#fclr:hover{background:#0a1f63;border-color:#0a1f63}
/* จัดแถวตัวกรอง: ชื่อหัวข้อซ้าย ตัวเลือกขวา + แบ่งกลุ่มด้วยเส้นบาง */
#fbox .fgh{display:block;width:fit-content;font-size:13px;font-weight:700;color:#fff;background:var(--acc);padding:4px 16px;border-radius:8px;margin:16px 0 10px}
#fbox .fgh.g0{background:#12308f}
#fbox .fgh.g1{background:#15803d}
#fbox .fgh.g2{background:#7e22ce}
#fbox .fgh.g3{background:#c2410c}
#fbox .fh+.fgh{margin-top:0}
#fbox .fg{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:10px;align-items:start;margin-bottom:12px}
#fbox .fg>b{display:block;margin:0;padding:2px 8px;font-size:13px;font-weight:600;color:var(--ink);background:none;border:1px solid transparent;border-radius:6px}
#fbox .fg.act>b{background:#e1ecff;color:#12308f;border-color:#9ec5fe}
#fbox .fo{max-height:none;overflow:visible;gap:6px 16px}
#fbox .fo label{padding:2px 0}
@media(max-width:640px){
  #fbox .fg{grid-template-columns:78px minmax(0,1fr);column-gap:8px}
  #fbox .fo{overflow-x:auto}
  #fbox .fo label{padding:3px 8px}
}
#fbox .fh{margin-bottom:14px}
/* ตัวกรองที่เรียงแนวตั้ง (เช่น MS Office) */
.fo.v{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:4px;max-height:none;overflow:visible}

/* ===== ปรับชุดสีให้แยกบทบาทชัดเจน ===== */
/* หัวเว็บ: สีเข้มเกือบดำ แยกจากปุ่มสีน้ำเงิน */
header{background:#0f172a;border-bottom:4px solid var(--acc)}
/* ปุ่มโหมด: ตัวที่ไม่ได้เลือกเป็นขาว/ขอบเทา ตัวที่เลือกเป็นน้ำเงินเต็ม */
.modes button{border:2px solid #94a3b8;color:#334155}
.modes button:hover{border-color:var(--acc);color:var(--acc)}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* แถบค้นหา: เขียวอมฟ้า (teal) ไม่ซ้ำกับสีน้ำเงินของปุ่ม */
#bar2 .fld{background:var(--teal);border-color:#0b5e57}
#bar2 .fld>label{color:#fff}
/* ปุ่ม Save = น้ำเงิน, ประวัติ = ขาว, Excel = เขียว, Refresh = ฟ้าคราม, Reset = แดง */
.savebox button{background:var(--acc)}
.savebox button.alt,.modes .savebox button.alt{background:#fff;color:#334155;border:2px solid #94a3b8}
#xl{background:#15803d!important}
.modes .savebox #rf{color:#0e7490;border-color:#0e7490}
.modes .savebox #rf:hover{background:#0e7490;color:#fff}
/* ปุ่มสรุปข้อมูลสาขา / OS-Office = ม่วงอ่อน */
.bgrp #bb,.bgrp #bo{background:#fff;color:#0033ff;border:1px solid #0033ff;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer}
.bgrp #bb:hover,.bgrp #bo:hover{background:#0033ff;color:#fff}
/* ปุ่มล้างตัวกรอง = ขาวขอบแดง (แยกจากหัวกลุ่มสีน้ำเงิน) */
#fclr{background:#fff;border:2px solid var(--err);color:var(--err);font-weight:700}
#fclr:hover{background:var(--err);border-color:var(--err);color:#fff}
/* ช่องที่แก้ไขแล้ว = เหลืองอำพัน (ไม่ซ้ำกับสีโฟกัสสีน้ำเงิน) */
.chg input,.chg textarea,.chg select{border-color:var(--amb);background:#fff7e0;box-shadow:0 0 0 1px var(--amb)}
/* ช่องตรวจเครื่อง = เขียวอมฟ้าอ่อน */
.chk{border:2px solid var(--teal);background:#e6f6f3}
.chk>label{color:var(--teal)}
/* หัวกลุ่มตัวกรอง */
#fbox .fgh.g0{background:#1d4ed8}
/* รายการที่เลือก: เหลืองอ่อน + แถบน้ำเงินด้านซ้าย เห็นชัดกว่าเดิม */
.it:hover{background:#e8f0ff}
.it.sel{background:#f7c7ac;box-shadow:inset 4px 0 0 var(--amb)}
/* ตัวเลขสรุป */
#stats .r,#stats .r b{color:var(--acc)}
#stats .r.s,#stats .r.s b{color:#0f172a}
/* ตารางสรุป: หัวตารางที่ 1 น้ำเงิน, ที่ 2 teal */
#brn table{--tc:#e3ebff}
/* ป้ายชื่อตัวกรอง (Window / MS Office / Antivirus ...) เป็นตัวอักษรธรรมดา ไม่มีป้าย */
#fbox .fg>b,#fbox .fg.act>b{background:none;border:0;border-radius:0;padding:2px 0;color:var(--ink);font-weight:600}
#fbox .fg.act>b{color:var(--acc);font-weight:700}
#fbox .fg.act>b label,#fbox .fg>b label{color:inherit}
/* ===== ขยายหน้าจอรายละเอียดเครื่อง (ฝั่งขวา, เดสก์ท็อป) ให้อ่านง่ายขึ้น ===== */
@media(min-width:641px){
  #grid .panel{padding:16px 18px}
  #grid .ttl{font-size:19px}
  #grid .sub{font-size:15px;margin:0 0 6px 10px}
  #grid #panel .sec{padding:5px 12px;margin:14px 0 9px;font-size:15px;border-radius:6px}
  #grid #panel .f{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
  #grid #panel label{font-size:13px;margin-bottom:3px;line-height:1.3}
  #grid #panel input,#grid #panel select{padding:5px 10px;font-size:14.5px;height:36px;border-radius:6px}
  #grid #panel .cb input{padding-right:30px}
  #grid #panel .cbb{width:28px;font-size:13px}
  #grid #panel textarea{padding:7px 10px;font-size:14.5px;line-height:1.4;min-height:36px;border-radius:6px}
  #grid #panel .chk{padding:5px 10px 8px;border-width:2px;border-radius:8px}
  #grid #panel .chk>label{font-size:13px}
  #grid #panel .asw .awh{font-size:13.5px}
  #grid #panel .asw .awx{height:36px}
  #grid #panel .asw .awa{font-size:14.5px;padding:7px 16px}
}
/* ===== หน้ารายละเอียดเครื่อง: วาง 3 ช่องต่อแถว ให้ข้อความในช่องแสดงครบ และพอดีกรอบหน้าจอ ===== */
@media(min-width:641px){
  #grid .panel{padding:8px 12px 10px}
  #grid .ttl{font-size:18px}
  #grid .sub{font-size:14px;margin:0 0 2px 8px}
  #grid #panel .sec{padding:3px 10px;margin:9px 0 5px;font-size:14.5px}
  #grid #panel .f{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
  #grid #panel label{font-size:12.5px;margin-bottom:1px;line-height:1.2}
  #grid #panel input,#grid #panel select{height:33px;padding:2px 6px;font-size:14px}
  #grid #panel .cb input{padding-right:26px}
  #grid #panel .cbb{width:24px}
  #grid #panel textarea{min-height:33px;padding:5px 8px;font-size:14px}
  #grid #panel .chk{padding:2px 7px 5px}
  #grid #panel .chk>label{font-size:12.5px}
  #grid #panel .f>.wfull{width:100%;grid-column:1/-1}
  #grid #panel .f>.kc{grid-column:span 2}
  #grid #panel .asw .awh{font-size:12.5px;margin-bottom:1px}
  #grid #panel .asw .awr{margin-bottom:4px;gap:6px}
  #grid #panel .asw .awx{height:33px}
  #grid #panel .asw .awa{font-size:13px;padding:4px 12px}
}
/* ปุ่ม Save / ประวัติ / Print to Excel ตอนยังกดไม่ได้: เทาอ่อน ตัวอักษรเทาเข้ม อ่านชัด (ไม่จาง) */
.modes .savebox #sv:disabled,.modes .savebox #hs:disabled,#xl:disabled{opacity:1;background:#e2e8f0!important;color:#475569;border:2px solid #94a3b8;cursor:not-allowed}
/* Save ตอนกดได้: น้ำเงินเข้ม ตัวหนังสือขาวหนา */
.modes .savebox #sv:not(:disabled){background:var(--acc);color:#fff;font-weight:700;border:2px solid var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.modes .savebox #sv:not(:disabled):hover{background:#1e40af;border-color:#1e40af}
/* ขยายหน้ารายละเอียดเครื่องออกทางขวา: เอาเพดานความกว้างออก ลดขอบขวา และลดความกว้างรายการด้านซ้าย */
main{max-width:1564px;padding-right:14px}
@media(min-width:641px){
  #grid.grid{grid-template-columns:210px minmax(0,1fr)}
  #grid .panel{padding-right:14px}
}
/* หัวรายการ (รหัส Asset ทั้งหมด — N รายการ) = แดงสด */
.list .head{color:#ff0000}
/* ช่อง Status / การตรวจเครื่อง: ตัวหนังสือแดงสด กรอบน้ำเงิน */
.chk{border-color:#0033ff}
.chk>label{color:#ff0000}
.chk select{color:#ff0000;font-weight:600}
.chk select option{color:#0b1426;font-weight:400}
/* ===== มือถือ (จอประมาณ 6.7 นิ้ว): ปุ่มใหญ่ กดง่าย จัดลำดับใหม่ให้เห็นรายการเร็ว ===== */
@media(max-width:640px){
  body{font-size:16px}
  main{display:flex;flex-wrap:wrap;gap:8px;max-width:none;padding:10px 10px calc(96px + env(safe-area-inset-bottom,0px))}
  .top,.modes,.sidew{display:contents}
  /* ลำดับบนหน้าจอ: ปุ่มโหมด > ตัวเลือก > ปุ่มเครื่องมือ > สรุปสาขา > รายการ/รายละเอียด > สรุปจำนวน */
  .modes>button{order:1;flex:1 1 28%;width:auto;min-height:48px;padding:8px 4px;font-size:16px;text-align:center;border-radius:10px}
  .bars{order:2;flex:1 1 100%;width:100%}
  .modes .savebox{order:3;flex:1 1 100%!important;width:100%;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bgrp{order:4;flex:1 1 100%;width:100%;flex-direction:row;gap:8px;margin:0}
  #grid{order:5;flex:1 1 100%;width:100%}
  #stats{order:6;flex:1 1 100%;width:100%;display:block;column-count:2;column-gap:16px;padding:8px 10px;font-size:14px}
  #stats .r{break-inside:avoid;padding:6px 0;font-size:14px}
  #stats .r b{font-size:15px}
  #stats .r.s{padding-left:10px}
  /* ปุ่มเครื่องมือ */
  .modes .savebox #xl,.modes .savebox #rf,.modes .savebox #rs{min-height:44px;padding:6px 4px;font-size:14px;border-radius:10px}
  .bgrp #bb,.bgrp #bo{flex:1;min-height:48px;font-size:14px;white-space:normal;border-radius:10px}
  /* Save / ประวัติ ลอยติดขอบล่างจอ (โผล่เมื่อเปิดเครื่องแล้ว) */
  .modes .savebox #sv,.modes .savebox #hs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;height:52px;font-size:17px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .modes .savebox #sv{left:10px;width:calc(60% - 14px)}
  .modes .savebox #hs{right:10px;width:calc(40% - 14px)}
  .modes .savebox #sv:disabled,.modes .savebox #hs:disabled{display:none}
  .modes #msg{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;margin:0;padding:8px 12px;font-size:15px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .modes #msg:empty{display:none}
  /* ช่องกรอก/ตัวเลือก */
  input,select,textarea{font-size:16px}
  .bar select,.bar input{font-size:16px;padding:10px;min-height:46px}
  #bar1 .fld,#bar2 .fld{flex:1 1 100%}
  .fld>label{font-size:14.5px}
  /* รายการ */
  .list{max-height:45vh}
  .list .head{font-size:14px;padding:8px 12px}
  .it{padding:12px 14px}
  .it b{font-size:17px}
  .it span{font-size:14px}
  /* รายละเอียดเครื่อง */
  .panel{padding:12px}
  .ttl{font-size:21px}
  .sec{font-size:16px;padding:8px 12px}
  .f{grid-template-columns:1fr;gap:10px}
  .f>.wfull{width:100%}
  .panel select,.panel input{min-height:46px}
  .panel textarea{min-height:76px}
  .chk{padding:6px 10px 10px}
  /* หน้า Filter */
  #fwrap{flex-direction:column}
  #fbox{max-width:none}
  #fbox .fg{grid-template-columns:minmax(0,1fr);row-gap:6px;margin-bottom:14px}
  #fbox .fg>b{font-size:15px}
  #fbox .fgh{font-size:15px}
  #fbox .fo{flex-wrap:wrap;overflow:visible;gap:8px;padding:0}
  #fbox .fo.v{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  #fbox .fo label{padding:8px 12px;font-size:15px;gap:8px;border:1px solid var(--line);border-radius:999px;background:#fff}
  #fbox .fo input{width:20px;height:20px}
  #fbox .fsel{min-height:46px;font-size:16px}
  #fbox .fh{gap:8px;flex-wrap:wrap}
  #fbox .fh button{min-height:44px;font-size:14px;padding:6px 14px;border-radius:10px}
  #fres .list{max-height:45vh}
  /* หน้าต่างสรุป/ประวัติ */
  #brn{padding:0;align-items:flex-end}
  #brn .box{max-width:none;border-radius:14px 14px 0 0;max-height:90vh}
  #brn table{font-size:13px}
  #brn th,#brn td{padding:8px 4px}
  #cam button{padding:14px 28px;font-size:16px}
}
/* หน้ากล้องสแกน: ปุ่มถ่ายรูป/เลือกรูป */
#cam button{min-width:240px;min-height:46px;font-size:16px}
#cam video{max-height:60vh}
#camw{overflow:hidden;border-radius:10px;touch-action:none;line-height:0;max-width:92vw}
#camw video{display:block;transform-origin:center center;border-radius:0}
#camz{display:flex;align-items:center;gap:10px;color:#fff;width:min(92vw,360px)}
#camz input[type=range]{flex:1;min-width:0;padding:0;height:28px;border:0;background:transparent;accent-color:#22c55e}
#cam #camz button{min-width:44px;min-height:44px;width:44px;padding:0;font-size:24px;font-weight:700;line-height:1;background:#fff;color:#0b1426;border-radius:50%}
#camz span{min-width:44px;text-align:right;font-weight:700;font-size:15px}
/* ปุ่ม Print to Excel ในแถบตัวกรอง */
#fbox .fh{gap:8px}
#fxl{background:#15803d;border:2px solid #15803d;color:#fff;font-weight:700}
#fxl:hover:not(:disabled){background:#166534;border-color:#166534}
#fxl:disabled{background:#e2e8f0;border-color:#94a3b8;color:#475569;cursor:not-allowed}
</style>

<body>
<div id="errbar" style="display:none;background:#b91c1c;color:#fff;padding:8px 14px;font-size:13px;white-space:pre-wrap;word-break:break-all"></div>
<main>
  <div class="top">
  <div class="modes">
    <button id="m1" class="on">เลือกตามสาขา</button>
    <button id="m2">ค้นหา</button>
    <button id="m3">Filter</button>
    <div class="savebox" id="savebox"><button id="sv" disabled>Save</button><button id="hs" class="alt" disabled>ประวัติ</button><button id="xl" class="xl" type="button">Print to Excel</button><button id="rf" type="button">Refresh</button><button id="rs" type="button">Reset All</button><span id="msg"></span></div>

    <div id="stats"></div></div>
  </div>
  <div class="bars">

  <div class="bar" id="bar1">
    <div class="fld"><label>ประเภท Asset</label><select id="typ"></select></div>
    <div class="fld"><label>สาขา</label><select id="loc"></select></div>
    <div class="fld"><label>Location</label><select id="loc2" disabled></select></div>
  </div>
  <div class="bar" id="bar2" hidden>
    <div class="fld"><label>ค้นหา</label><div class="in"><input id="q2" placeholder="ค้นหา รหัส Asset / Computername / Serial / ผู้ถือครอง"><button class="ic" data-mic="q2" title="พูด">🎤</button><button class="ic" data-scan="q2" title="สแกน">▦</button><button class="ic" data-snap="q2" title="ถ่ายรูปแล้วสแกน">📷</button></div></div>
  </div>
  <div class="bar" id="bar3" hidden>

  </div>
  </div>
  </div>

      <div class="list" id="list"><div class="empty">กำลังโหลดข้อมูล…</div></div>

    <div class="panel" id="panel2" hidden></div>

</main>

<div id="brn"><div class="box"><div class="hd"><span id="brt">ข้อมูลเครื่องแต่ละสาขา</span><button id="bx" title="ปิด">✕</button></div><div class="bd" id="bbd"></div></div></div>

<div id="dls"></div>
<div id="qrtmp" style="position:absolute;left:-9999px;width:300px"></div>

<script>
// สลับโหมดแบบอิสระ: ทำงานได้แม้สคริปต์หลักมีปัญหา
(function(){
  var btns=document.querySelectorAll('.modes>button');
  for(var i=0;i<btns.length;i++){(function(b){
    b.addEventListener('click',function(){
      var m=b.id.slice(1);
      for(var k=1;k<=3;k++){
        var bt=document.getElementById('m'+k),br=document.getElementById('bar'+k);
        if(bt)bt.className=(k==m?'on':'');
        if(br)br[k==m?'removeAttribute':'setAttribute']('hidden','');
      }
    });
  })(btns[i]);}

    if(f.fixed){const ex=vals.filter(v=>v&&!BRANCHES.includes(v)); vals=BRANCHES.concat(ex);}

    const lbls=vals.map(v=>`<label><input type="checkbox" data-f="${j}" value="${esc(v)}">${v?esc(v):'(ว่าง)'}</label>`).join('');
    if(f.dd){
      h+=`<div class=\"fg\"><b>${f.k}</b><div><select class=\"fsel\" data-s=\"${j}\"><option value=\"__NONE__\">-- ทั้งหมด --</option>`+
        vals.map(v=>`<option value=\"${esc(v)}\">${v?esc(v):'(ว่าง)'}</option>`).join('')+'</select></div></div>';
      return;

      vals.map(v=>`<label><input type="checkbox" data-f="${j}" value="${esc(v)}">${lab(v)}</label>`).join('')+

function rebuildFilters(){
  const keep=SEL.map(x=>[...x]);
  buildFilters();
  keep.forEach((arr,j)=>{
    if(!SEL[j]||!arr.length)return;
    SEL[j]=new Set(arr);
    $('fbox').querySelectorAll('input[data-f="'+j+'"],input[data-tg="'+j+'"]').forEach(x=>{
      x.checked=x.dataset.tg!==undefined?true:SEL[j].has(x.value);
    });
    const sl=$('fbox').querySelector('select[data-s="'+j+'"]'); if(sl&&arr[0])sl.value=arr[0];
  });

}
// แถวที่ผ่านตัวกรอง (null = ยังไม่ได้เลือกตัวกรองใด)
function filterRows(){
  const act=SEL.map((s,j)=>s.size?j:-1).filter(j=>j>=0);
  if(!act.length)return null;
  return R.filter(r=>act.every(j=>SEL[j].has(ALL)||SEL[j].has(FIL[j].get(r))));
}

// Print to Excel: ส่งออกทุกรายการและทุกคอลัมน์ ไม่เกี่ยวกับตัวกรอง
let xlsxP=null;
function loadXlsx(){
  if(window.XLSX)return Promise.resolve();
  if(!xlsxP)xlsxP=new Promise((ok,no)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=ok;sc.onerror=()=>{xlsxP=null;no(new Error('โหลดตัวสร้าง Excel ไม่สำเร็จ'));};
    document.head.appendChild(sc);
  });
  return xlsxP;
}
function saveBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function exportExcel(){

  H.forEach((h,i)=>cols.push([String(h||'').trim()||('คอลัมน์ '+(i+1)),r=>r.v[i]]));
  const data=[cols.map(c=>c[0])].concat(rows.map(r=>cols.map(c=>{const v=c[1](r);return typeof v==='number'?v:String(v??'');})));
  const d=new Date(),p2=n=>String(n).padStart(2,'0');
  const name='IT_Asset_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes());
  const m=$('msg'); m.className='';m.textContent='กำลังสร้างไฟล์ Excel…';
  try{
    await loadXlsx();
    const ws=XLSX.utils.aoa_to_sheet(data);

function autoFit(el){
  if(!el)return;
  if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=el.scrollHeight+'px';return;}
  const w=el.closest('.kc'); if(!w||!PCQ.matches)return;
  const cols=getComputedStyle(w.parentNode).gridTemplateColumns.split(' ').length||1;
  const span=Math.min(cols,Math.max(1,Math.ceil((el.value.length+4)/17)));
  w.style.gridColumn='span '+span;
}

function awParse(v){
  return String(v||'').split(/\r?\n|\s,\s/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const k=x.indexOf('|'); return k<0?[x,'']:[x.slice(0,k).trim(),x.slice(k+1).trim()];
  });
}
function awRow(n,l){
  return `<div class="awr"><input class="aw-n" placeholder="ชื่อโปรแกรม" value="${esc(n)}" autocomplete="off"><input class="aw-l" placeholder="License / Key" value="${esc(l)}" autocomplete="off"><button type="button" class="awx" aria-label="ลบ" title="ลบแถวนี้">✕</button></div>`;
}
function awSync(box){
  const out=[...box.querySelectorAll('.awr')].map(r=>{
    const cl=x=>x.replace(/[|\r\n]/g,' ').replace(/\s,\s/g,', ').trim();
    const n=cl(r.querySelector('.aw-n').value);
    const l=cl(r.querySelector('.aw-l').value);
    return (n||l)?(l?n+' | '+l:n):'';
  }).filter(Boolean).join(' , ');
  const h=box.querySelector('input[type=hidden]');
  h.value=out; h.dispatchEvent(new Event('input',{bubbles:true}));

// เลือกเฉพาะคำที่ชัดที่สุดคำเดียว แม้มีข้อความอื่นติดมาในภาพด้วย
let tessP=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(!tessP)tessP=new Promise((ok,no)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload=ok;sc.onerror=()=>{tessP=null;no(new Error('โหลดตัวอ่านข้อความไม่สำเร็จ'));};
    document.head.appendChild(sc);
  });
  return tessP;
}
async function toCanvas(src,zm){
  let w,h,draw;
  if(src instanceof HTMLVideoElement){const z=zm>1?zm:1,vw=src.videoWidth,vh=src.videoHeight;w=Math.round(vw/z);h=Math.round(vh/z);const sx=(vw-w)/2,sy=(vh-h)/2;draw=(c,cw,ch)=>c.drawImage(src,sx,sy,w,h,0,0,cw,ch);} // ครอปตามระดับซูมแบบดิจิทัล ภาพที่ได้ตรงกับที่เห็น
  else{const bm=await createImageBitmap(src);w=bm.width;h=bm.height;draw=(c,cw,ch)=>c.drawImage(bm,0,0,cw,ch);}
  const k=Math.min(1,1600/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  draw(cv.getContext('2d'),cv.width,cv.height);
  return cv;
}
const ocrClean=t=>String(t||'').replace(/[^A-Za-z0-9\-_\/.]/g,'').replace(/^[-_.\/]+|[-_.\/]+$/g,'');
const ocrNorm=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function ocrBest(src){
  await loadTess();
  const cv=await toCanvas(src);
  const wk=await Tesseract.createWorker('eng');
  let data;
  try{data=(await wk.recognize(cv)).data;}finally{try{await wk.terminate();}catch(e){}}
  const words=(data.words||[]).map(w=>({t:ocrClean(w.text),c:w.confidence||0,h:w.bbox?(w.bbox.y1-w.bbox.y0):0}))
    .filter(w=>w.t.length>=3&&w.c>=50);
  if(!words.length)return '';
  // เลือกเฉพาะคำที่ชัดที่สุดคำเดียว (ไม่สนคำอื่นในภาพ): ความมั่นใจสูงสุด; กลุ่มที่ใกล้เคียงกัน (ห่างไม่เกิน 8) เลือกตัวใหญ่สุด แล้วยาวสุด
  const top=Math.max(...words.map(w=>w.c));
  const best=words.filter(w=>w.c>=top-8).sort((a,b)=>b.h-a.h||b.t.length-a.t.length||b.c-a.c);
  return best[0].t;
}
async function runOcr(src){
  const m=$('msg');m.className='';m.textContent='กำลังอ่านข้อความ…';
  try{
    const t=await ocrBest(src);
    if(!t){m.className='bad';m.textContent='ไม่พบข้อความที่ชัดพอ';return false;}
    m.className='ok';m.textContent='อ่านได้: '+t;applyVal(scanTarget,t);return true;
  }catch(e){m.className='bad';m.textContent=e.message;return false;}
}
// สแกนจากภาพนิ่ง (ภาพที่ถ่าย หรือรูปในเครื่อง): 1) อ่านบาร์โค้ด/QR 2) ถ้าไม่เจอ อ่านข้อความและเลือกคำที่ชัดที่สุด
async function scanImage(src){
  const m=$('msg');m.className='';m.textContent='กำลังสแกนภาพ…';
  let file=src;
  if(src instanceof HTMLCanvasElement){
    const bl=await new Promise(r=>src.toBlob(r,'image/jpeg',0.92));
    file=new File([bl],'shot.jpg',{type:'image/jpeg'});
  }
  try{
    const t=String(await decodeFile(file)).trim();
    if(t){m.className='ok';m.textContent='สแกนได้: '+t;applyVal(scanTarget,t);return true;}
  }catch(e){}
  return runOcr(src instanceof HTMLCanvasElement?src:file);
}

const CZ={z:1,min:1,max:5,step:0.1,hw:false,tr:null};
function camZoomSet(z){
  z=Math.round(Math.min(CZ.max,Math.max(CZ.min,z))*100)/100;CZ.z=z;
  $('camzr').value=z;$('camzl').textContent=z.toFixed(1)+'x';
  if(CZ.hw&&CZ.tr){CZ.tr.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});$('vid').style.transform='';}
  else $('vid').style.transform=z>1?'scale('+z+')':'';
}
function camZoomInit(){
  CZ.tr=stream&&stream.getVideoTracks()[0]||null;CZ.hw=false;CZ.min=1;CZ.max=5;CZ.step=0.1;
  try{
    const c=CZ.tr&&CZ.tr.getCapabilities&&CZ.tr.getCapabilities();
    if(c&&c.zoom&&c.zoom.max>c.zoom.min){CZ.hw=true;CZ.min=c.zoom.min;CZ.max=Math.min(c.zoom.max,10);CZ.step=c.zoom.step||0.1;}
  }catch(e){}
  const r=$('camzr');r.min=CZ.min;r.max=CZ.max;r.step=CZ.step;
  camZoomSet(CZ.min);
}
function camZoomReset(){CZ.z=1;CZ.hw=false;CZ.tr=null;try{$('vid').style.transform='';$('camzr').value=1;$('camzl').textContent='1.0x';}catch(e){}}
$('camzr').oninput=e=>camZoomSet(parseFloat(e.target.value));
$('camzm').onclick=()=>camZoomSet(CZ.z-Math.max(0.5,CZ.step));
$('camzp').onclick=()=>camZoomSet(CZ.z+Math.max(0.5,CZ.step));
$('camw').addEventListener('wheel',e=>{e.preventDefault();camZoomSet(CZ.z+(e.deltaY<0?0.3:-0.3));},{passive:false});
(function(){
  const pts=new Map();let d0=0,z0=1;
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  const w=$('camw');
  w.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{w.setPointerCapture(e.pointerId);}catch(x){}if(pts.size===2){d0=dist();z0=CZ.z;}});
  w.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2&&d0>0)camZoomSet(z0*dist()/d0);});
  const up=e=>{pts.delete(e.pointerId);};
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
})();

const BRN_LABEL={SNNP:'HQ'};
function showBranchCounts(){
  $('brt').textContent='ข้อมูลเครื่องแต่ละสาขา';
  const L=LOC(), cnt={};
  const Z=()=>({rent:0,asset:0,pc:0,nb:0});
  const bump=(c,r)=>{c[typeOf(r)==='เครื่องเช่า'?'rent':'asset']++; c[isNB(r)?'nb':'pc']++;};
  R.forEach(r=>{
    let b=branchOf(r.v[L]); if(!BRANCHES.includes(b)) b='อื่น ๆ';
    const o=cnt[b]=cnt[b]||{t:Z(),locs:{}};
    bump(o.t,r);
    const lc=String(r.v[L]??'').trim()||'(ว่าง)';
    bump(o.locs[lc]=o.locs[lc]||Z(),r);
  });
  const order=BRANCHES.concat(Object.keys(cnt).filter(k=>!BRANCHES.includes(k)));
  const T=Z();
  const tds=c=>`<td>${c.rent}</td><td>${c.asset}</td><td>${c.pc}</td><td>${c.nb}</td><td><b>${c.rent+c.asset}</b></td>`;
  const rows=order.map((b,i)=>{
    const o=cnt[b]||{t:Z(),locs:{}}; for(const k in T)T[k]+=o.t[k];
    const ls=Object.keys(o.locs).sort((x,y)=>x.localeCompare(y,'th'));
    const head=`<tr class="br${ls.length?' has':''}" data-i="${i}"><td><span class="car">${ls.length?'▸':''}</span>${esc(BRN_LABEL[b]||b)}</td>${tds(o.t)}</tr>`;
    const sub=ls.map(l=>`<tr class="lc" data-p="${i}"><td>${esc(l)}</td>${tds(o.locs[l])}</tr>`).join('');
    return head+sub;
  }).join('');
  $('bbd').innerHTML=`<table><thead><tr><th>สาขา / Location</th><th>เครื่องเช่า</th><th>Asset SNNP</th><th>PC</th><th>NB</th><th>รวม</th></tr></thead><tbody>${rows}<tr class="tot"><td>รวมทั้งหมด</td><td>${T.rent}</td><td>${T.asset}</td><td>${T.pc}</td><td>${T.nb}</td><td>${T.rent+T.asset}</td></tr></tbody></table>`;
  $('brn').style.display='flex';
}
$('bbd').onclick=e=>{
  const tr=e.target.closest('tr.br.has'); if(!tr)return;
  const open=tr.classList.toggle('open');
  tr.querySelector('.car').textContent=open?'▾':'▸';
  $('bbd').querySelectorAll(`tr.lc[data-p="${tr.dataset.i}"]`).forEach(x=>x.style.display=open?'table-row':'none');
};
function showOsOffice(){
  $('brt').textContent='ข้อมูล OS-MS Office';
  const L=LOC(), cols=[['OS (Window)',col('Window')],['MS Office',col('MS Office')]];
  const has={}; const data=cols.map(()=>({}));
  R.forEach(r=>{
    let b=branchOf(r.v[L]); if(!BRANCHES.includes(b)) b='อื่น ๆ'; has[b]=1;
    cols.forEach(([,ci],k)=>{
      const v=(ci>=0?String(r.v[ci]??'').trim():'')||'(ไม่ระบุ)';
      const o=data[k][v]=data[k][v]||{t:0}; o[b]=(o[b]||0)+1; o.t++;
    });
  });
  const bs=BRANCHES.concat(has['อื่น ๆ']?['อื่น ๆ']:[]);
  const tbl=([title],k)=>{
    const keys=Object.keys(data[k]).sort((x,y)=>data[k][y].t-data[k][x].t||x.localeCompare(y,'th'));
    const T={t:0}; 
    const rows=keys.map(v=>{const o=data[k][v];T.t+=o.t;bs.forEach(b=>T[b]=(T[b]||0)+(o[b]||0));
      return `<tr><td>${esc(v)}</td>${bs.map(b=>`<td>${o[b]||0}</td>`).join('')}<td><b>${o.t}</b></td></tr>`;}).join('');
    return `<table class="${k?'t2':''}" style="margin-top:8px"><thead><tr><th>${esc(title)}</th>${bs.map(b=>`<th>${esc(BRN_LABEL[b]||b)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${rows||'<tr><td colspan="'+(bs.length+2)+'">ไม่มีข้อมูล</td></tr>'}<tr class="tot"><td>รวมทั้งหมด</td>${bs.map(b=>`<td>${T[b]||0}</td>`).join('')}<td>${T.t}</td></tr></tbody></table>`;
  };
  $('bbd').innerHTML=cols.map(tbl).join('<div style="height:14px"></div>');
  $('brn').style.display='flex';
}
$('bb').onclick=showBranchCounts;
$('bo').onclick=showOsOffice;
$('bx').onclick=()=>{$('brn').style.display='none';};
$('brn').onclick=e=>{if(e.target===$('brn'))$('brn').style.display='none';};
</script>
