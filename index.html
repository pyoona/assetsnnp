<!DOCTYPE html>
<html lang="th">
<head>
<script>if(/iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))document.documentElement.classList.add('ipad');</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Asset SNNP</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1426;--mut:#3f485c;--line:#c3cbdb;--bg:#f2f5fa;--card:#fff;--acc:#1d4ed8;--hi:#1d4ed8;--ok:#15803d;--err:#b91c1c;--teal:#0f766e;--amb:#d97706}
*{box-sizing:border-box}
/* ขีดล่าง _ ใช้ฟอนต์ตัวหนาของระบบแทน Sarabun (ขีดของ Sarabun บางและต่ำจนเห็นเป็นสีเทาจาง) */
@font-face{font-family:'Us';font-weight:100 900;unicode-range:U+005F;src:local('Arial Bold'),local('Arial-BoldMT'),local('Helvetica Bold'),local('Roboto Bold'),local('Roboto-Bold'),local('DejaVu Sans Bold'),local('Segoe UI Bold')}
body{margin:0;font-family:'Us','Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--ink);color:#fff;padding:14px 18px;font-weight:600;font-size:18px}
main{max-width:1400px;margin:0;padding:14px}
.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.bars{flex:1 1 0;min-width:0}
.modes{display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex:0 0 auto}
.modes button{flex:0 0 auto;width:120px;padding:6px 12px;border:2px solid var(--ink);background:#fff;font:inherit;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--ink);text-align:left}
.modes button.on{background:var(--hi);border-color:var(--hi);color:#fff}
.bar[hidden]{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.bar>*{flex:1 1 180px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.in{display:flex;gap:6px}
.ic{flex:0 0 44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.ic.rec{background:var(--err);color:#fff}
.grid[hidden],.list[hidden]{display:none}
.grid.one{grid-template-columns:minmax(0,1fr)!important}
.fld{flex:1 1 220px}
.fld[hidden]{display:none}
#assetbar{margin-bottom:10px}
#left{min-width:0}
.fld>label{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:5px}
.bar .fld{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#bar2 .fld{background:var(--hi);border-color:#0a1f63}
#bar2 .fld>label{color:#fff}
input[readonly]{background:#eef0f4;color:var(--mut)}
select:disabled{background:#eef0f4}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:641px){.grid{grid-template-columns:340px minmax(0,1fr)}}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:70vh;overflow:auto}
.list .head{padding:8px 12px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.it{padding:5px 12px;line-height:1.3;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:#eef3ff}.it.sel{background:#f8cbad;color:var(--ink)}.it.sel span{color:var(--mut)}
.it b{display:block}.it span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.empty{color:var(--mut);padding:30px;text-align:center}
.ttl{font-size:18px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.sec{background:#a9d08e;color:var(--ink);padding:6px 10px;font-weight:600;border-radius:6px;margin:16px 0 10px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.chg input{border-color:var(--acc);background:#f1f5ff}
.chk{border:2px solid #2563eb;background:#e8f1ff;border-radius:10px;padding:6px 10px 10px}
.chk>label{color:#12308f;font-weight:600}
.savebox{flex:0 0 auto!important;align-self:center;position:relative;display:flex}
.savebox button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
#msg{position:absolute;right:0;top:100%;margin-top:4px;font-size:13px;white-space:nowrap}
.savebox{gap:6px}
.savebox button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
#hist{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
#hist .box{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column}
#hist .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
#hist .hd button{border:0;background:none;font-size:20px;cursor:pointer}
#hist .bd{overflow:auto;padding:0 16px 12px}
#hist table{border-collapse:collapse;width:100%;font-size:14px}
#hist th,#hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#hist th{position:sticky;top:0;background:#fff;color:var(--mut);font-weight:500}
.old{color:var(--err);text-decoration:line-through}.new{color:var(--ok)}
.savebox button:disabled{opacity:.5;cursor:default}
#msg{font-weight:500}.ok{color:var(--ok)}.bad{color:var(--err)}
#cam{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9}
#cam video{max-width:92vw;max-height:70vh;border-radius:10px}
#cam button{padding:10px 24px;border-radius:8px;border:0;font:inherit}

/* ปรับขนาดแถบตัวเลือกให้กะทัดรัด (เดสก์ท็อป) */
@media(min-width:641px){
  .bar{gap:6px;margin-bottom:10px}
  .bar>*{flex:1 1 140px}
  .bar .fld{padding:5px 8px;border-radius:8px}
  .fld>label{font-size:12px;margin-bottom:2px}
  .bar select,.bar input{font-size:13px;padding:5px 8px;border-radius:6px}
  .ic{flex:0 0 34px;font-size:15px;border-radius:6px}
  .savebox button{padding:6px 12px;font-size:13px;border-radius:6px}
}

/* ตัวกรอง (โหมดที่ 3) */
#bar3 .fld{flex:1 1 100%;min-width:0}
.fh{display:flex;justify-content:flex-start;align-items:center;margin-bottom:8px;font-weight:600}
.fh button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
#fwrap{display:flex;flex-direction:column;gap:14px}
#fbox,#fres{min-width:0}
#fres .grid{grid-template-columns:minmax(0,1fr)}
#fres .list{max-height:32vh}
@media(min-width:641px){
  #fwrap{flex-direction:row;align-items:flex-start}
  #fbox{flex:0 0 auto;max-width:45%}
  #fres{flex:1 1 0}
}
.fx{margin-top:6px}
.fx button{background:#15803d;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.fx button:disabled{opacity:.45;cursor:default}
.fg{margin-bottom:10px}
.fg>b{display:inline-block;font-size:14px;margin-bottom:8px;padding:6px 16px;background:#e1ecff;color:#12308f;border:2px solid #9ec5fe;border-radius:8px;font-weight:600}
.fo{display:flex;flex-wrap:wrap;gap:6px 16px;max-height:120px;overflow:auto}
.fo label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.fo input{width:18px;height:18px;padding:0;accent-color:var(--acc)}

@media(max-width:640px){
  body{font-size:16px}
  header{padding:12px 14px;font-size:17px}
  main{padding:10px}
  input,select{font-size:16px;padding:12px}
  .top{flex-direction:column;gap:8px}.bars{width:100%;flex:none}
  .modes{flex-direction:row;width:100%;gap:6px}.modes button{flex:1;width:auto;min-width:0;padding:9px 6px;font-size:14px;text-align:center}
  .bar{gap:6px;margin-bottom:10px}
  #bar1 .fld{flex:1 1 calc(33.333% - 4px);min-width:0;padding:6px 8px;border-radius:8px}
  #bar2 .fld{flex:1 1 100%;padding:6px 8px}
  .fld>label{font-size:12px;margin-bottom:3px}
  .bar select,.bar input{font-size:14px;padding:7px 8px}
  .fo input{width:18px;height:18px;padding:0}
  .fo{flex-wrap:nowrap;gap:8px;max-height:none;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .fo::-webkit-scrollbar{height:6px}
  .fo::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .fo label{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}
  .fo label:has(input:checked){background:#e8f1ff;border-color:var(--acc);font-weight:600;color:var(--acc)}
  .bar .ic{flex:0 0 40px;font-size:16px}
  .savebox{flex:1 1 100%!important;align-self:stretch;gap:6px}
  .savebox button{flex:1;padding:8px;font-size:14px}
  #msg{position:static;margin:0;align-self:center;white-space:normal;flex:1}
  .list{max-height:38vh}
  .it{padding:8px 12px}
  .panel{padding:12px}
  .f{grid-template-columns:1fr}
  .ic{flex:0 0 48px}
  #hist{padding:12px;align-items:center}
  #hist .box{max-width:none;border-radius:14px;max-height:85vh;max-height:85dvh}
  #hist table:not(.hall) th:nth-child(4),#hist table:not(.hall) td:nth-child(4){display:none}
  #hist table{font-size:13px}
}
/* ปรับให้เล็กลงอีก: ปุ่มและตัวอักษรของตัวกรอง/ปุ่มบันทึก (ทุกหน้าจอ) */
.fh{margin-bottom:6px}
.fh button{padding:3px 10px;font-size:12px;border-radius:6px}
.fg{margin-bottom:6px}
.fg>b{font-size:12px;padding:2px 10px;margin-bottom:4px;border-width:1px;border-radius:6px}
.fo{gap:4px 12px}
.fo label{font-size:12px;gap:4px}
.fo input{width:14px;height:14px}
.fx button{padding:5px 12px;font-size:12px;border-radius:6px}
.savebox button{padding:5px 12px;font-size:12px;border-radius:6px}
#msg{font-size:12px}
@media(max-width:640px){
  .fo{gap:6px}
  .fo label{padding:3px 8px}
  .fo input{width:14px;height:14px}
  .savebox button{padding:6px;font-size:12px}
  .it{padding:5px 12px}
}
/* ปุ่ม Save / ประวัติ ต่อจากปุ่ม Filter */
.modes .savebox{flex:0 0 auto!important;align-self:flex-start;width:120px;flex-direction:column;align-items:stretch;gap:6px;margin-top:4px}
.modes .savebox button{width:100%;text-align:center;border:0}
.modes .savebox button.alt{border:1px solid var(--line)}
.modes #msg{position:static;margin:0;white-space:normal;text-align:center}
@media(max-width:640px){
  .modes{flex-wrap:wrap}
  .modes .savebox{flex:1 1 100%!important;width:100%;flex-direction:row;align-items:center;margin-top:0}
  .modes .savebox button{flex:1;width:auto}
  .modes #msg{flex:1 1 100%}
}
/* ช่องเลือกจากรายการหรือพิมพ์เพิ่มเอง (Product Key, ผู้ถือครอง) */
.cb{position:relative}
.cb input{width:100%;padding-right:26px}
.cbb{position:absolute;right:1px;top:1px;bottom:1px;width:24px;border:0;border-left:1px solid var(--line);background:#eef0f4;color:var(--ink);border-radius:0 5px 5px 0;cursor:pointer;font-size:12px;padding:0}
.cbl{position:absolute;left:0;right:0;top:100%;z-index:30;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:2px}
.cbl .o{padding:6px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid #eef0f4;word-break:break-all}
.cbl .o:hover{background:#eef3ff}
.cbl .no{padding:6px 10px;font-size:12px;color:var(--mut)}
#xl{background:#15803d!important;color:#fff}
#xl:disabled{opacity:.45}
/* ทุกโหมดบนคอม: รายการย่อให้สั้น, Software/Hardware อยู่ข้างรายการ */
@media(min-width:641px){
  #grid.grid{grid-template-columns:240px minmax(0,1fr);grid-template-areas:"list p1";gap:8px;align-items:start}
  #grid #left{grid-area:list;position:sticky;top:8px}
  #grid #panel{grid-area:p1}
  #grid #panel2{display:none}
  #grid .list{max-height:calc(100vh - 16px)}
  #fres .list{height:calc(100vh - 16px)}
  #grid .head{padding:4px 10px;font-size:12px}
  #grid .it{padding:5px 10px}
  #grid .it b{font-size:13px}
  #grid .it span{font-size:12px}
  #grid .panel{padding:10px 12px}
  #grid .ttl{font-size:14px;display:inline}
  #grid .sub{display:inline;margin:0 0 4px 8px;font-size:13px}
  #grid #panel .sec{padding:2px 8px;margin:8px 0 5px;font-size:13px;border-radius:5px}
  #grid #panel .f{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px 8px}
  #grid #panel label{font-size:11px;margin-bottom:1px;line-height:1.2}
  #grid #panel input,#grid #panel select{padding:3px 6px;font-size:12px;border-radius:5px;height:26px}
  #grid #panel .chk{padding:3px 6px 5px;border-width:1px;border-radius:6px}
  #grid #panel .chk>label{font-size:11px}
  #grid #panel2 .sec:first-child{margin-top:0}
}
/* สรุปจำนวน (ใต้ปุ่ม Save/ประวัติ) */
#stats{width:150px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
#stats .r{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid #eef0f4}
#stats .r{white-space:nowrap}
#stats .r,#stats .r b,#stats .r.s,#stats .r.s b{color:#0033ff;font-weight:700}
#stats .r:last-child{border-bottom:0}
#stats .oth-h{cursor:pointer}
#stats .oth-l{max-height:180px;overflow:auto;border-bottom:1px solid #eef0f4}
#stats .oth-l .r{padding-left:18px;font-size:11px}
#stats .oth-l[hidden]{display:none}
#stats .r b{font-size:15px;color:var(--acc)}
#stats .r.s{padding-left:10px;color:var(--mut)}
#stats .r.s b{font-size:13px;color:var(--ink)}
@media(max-width:640px){#stats{width:100%;flex:1 1 100%}}
@supports(padding:max(0px)){main{padding-bottom:max(14px,env(safe-area-inset-bottom))}}

.fg>b label{display:inline;margin:0;font-size:inherit;color:inherit;font-weight:inherit;cursor:pointer}
.fg>b input{width:18px;height:18px;padding:0;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--acc)}
.fsec{background:#a9d08e;color:var(--ink);padding:5px 10px;font-weight:700;border-radius:6px;margin:14px 0 10px;font-size:14.5px}
/* ปรับความคมชัด/อ่านง่าย */
html{-webkit-text-size-adjust:100%}
body{font-size:17px;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:0}
input,select,button,textarea{font-family:inherit;color:var(--ink)}
input,select{font-size:16px;line-height:1.4;border-color:#aeb8cc}
/* ฟอนต์ Sarabun วางขีด _ ต่ำกว่าเส้นฐานมาก — line-height 1.4 ทำให้ช่องกรอกตัดขีดล่างทิ้ง */
#panel input,#panel2 input,#panel textarea,#fbox input[type=text],.bar input{line-height:normal}
label{font-size:14px;color:var(--mut);font-weight:500;margin-bottom:4px}
.fld>label{font-size:14.5px;font-weight:600}
#bar2 .fld>label{color:#fff}
.it span,.list .head,.sub{font-size:14px}
.it b{font-weight:600;font-size:15.5px}
.ttl{font-size:20px;font-weight:700}
.sec{font-weight:700;font-size:15.5px}
header{font-weight:700;font-size:19px;letter-spacing:.2px}
.modes button{font-size:14px}
#hist table{font-size:14.5px}
#hist th{color:var(--ink);font-weight:600}
.fo label,.fg>b,.fh button{font-size:14.5px}
@media(max-width:640px){
  .fld>label,label{font-size:13.5px}
  .bar select,.bar input{font-size:15px}
  #hist table{font-size:14px}
}
/* ปุ่ม Reset All (ใต้สรุปจำนวน) */
.modes .savebox #rf{width:100%;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;background:#fff;color:var(--acc);border:2px solid var(--acc);border-radius:6px;cursor:pointer}
.modes .savebox #rf:hover{background:var(--acc);color:#fff}
.modes .savebox #rf:disabled{opacity:.5;cursor:default}
.modes .savebox #rs{width:100%;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;background:#fff;color:var(--err);border:2px solid var(--err);border-radius:6px;cursor:pointer}
.modes .savebox #rs:hover{background:var(--err);color:#fff}
/* ขยายช่อง Product Key (2 ช่อง) และ หมายเหตุ (เต็มแถว) */
.f>.wfull{grid-column:1/-1}
textarea{width:100%;display:block;padding:10px;border:1px solid #aeb8cc;border-radius:8px;font:inherit;font-size:16px;line-height:1.4;background:#fff;color:var(--ink);resize:none;overflow:hidden}
textarea:focus{outline:3px solid var(--acc);outline-offset:1px}
.chg textarea{border-color:var(--acc);background:#f1f5ff}
@media(min-width:641px){#grid #panel textarea{padding:3px 6px;font-size:12px;line-height:1.3;border-radius:5px;min-height:26px}}
@media(max-width:640px){textarea{font-size:16px;padding:12px}}
/* ช่องสรุปจำนวน: หัวข้อสีน้ำเงิน รายการย่อย (-) สีดำ */
#stats{width:175px}
#stats .r.s,#stats .r.s b{color:#000;font-weight:500}
#stats .r.s b{font-size:13px}
@media(max-width:640px){#stats{width:100%}}

.sidew{display:flex;flex-direction:column;gap:8px;width:fit-content;margin-top:4px}
.sidew .bgrp{margin-top:0}
.sidew #stats{width:0;min-width:100%;margin-top:0;padding:5px 6px;font-size:11px;overflow:hidden}
.sidew #stats .r{gap:4px}.sidew #stats .r.s{padding-left:8px}
.sidew #stats .r b{font-size:13px}.sidew #stats .r.s b{font-size:12px}
.bgrp{display:flex;flex-direction:column;gap:6px;width:fit-content;margin-top:4px}
.bgrp #bb,.bgrp #bo{width:100%;white-space:nowrap;font-size:12px;text-align:center;margin:0}
@media(max-width:640px){.sidew{flex:1 1 100%;width:100%}.sidew #stats{width:100%;min-width:0}.bgrp{width:100%}.bgrp #bb,.bgrp #bo{white-space:normal}}
#brn{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
#brn .box{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column}
#brn .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
#brn .hd button{border:0;background:none;font-size:20px;cursor:pointer}
#brn .bd{overflow:auto;padding:0 16px 12px}
#brn table{border-collapse:collapse;width:100%;font-size:14px}
#brn th,#brn td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}

#brn th{background:var(--hc);color:#fff;font-weight:600;border-bottom:0;padding:10px 8px}
#brn th:first-child{border-radius:8px 0 0 8px;padding-left:12px}
#brn th:last-child{border-radius:0 8px 8px 0;padding-right:12px}
#brn td:first-child{padding-left:12px}#brn td:last-child{padding-right:12px}
#brn tbody tr:not(.tot):not(.lc):hover td{background:#f3f6f9}
#brn tr.tot td{background:var(--tc)}

/* ซ่อนป้ายชื่อซ้ำของ Additional Software และ หมายเหตุ (มีหัวแถบสีเขียวอยู่แล้ว) */

/* จัดแถวตัวกรอง: ชื่อหัวข้อซ้าย ตัวเลือกขวา + แบ่งกลุ่มด้วยเส้นบาง */
#fbox .fgh{display:block;width:fit-content;font-size:13px;font-weight:700;color:#fff;background:var(--acc);padding:4px 16px;border-radius:8px;margin:16px 0 10px}

}
#fbox .fh{margin-bottom:14px}
/* ตัวกรองที่เรียงแนวตั้ง (เช่น MS Office) */
.fo.v{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:4px 24px;align-items:start;max-height:none;overflow:visible}

/* ===== ปรับชุดสีให้แยกบทบาทชัดเจน ===== */
/* หัวเว็บ: สีเข้มเกือบดำ แยกจากปุ่มสีน้ำเงิน */
header{background:#0f172a;border-bottom:4px solid var(--acc)}
/* ปุ่มโหมด: ตัวที่ไม่ได้เลือกเป็นขาว/ขอบเทา ตัวที่เลือกเป็นน้ำเงินเต็ม */
.modes button{border:2px solid #94a3b8;color:#334155}
.modes button:hover{border-color:var(--acc);color:var(--acc)}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* แถบค้นหา: เขียวอมฟ้า (teal) ไม่ซ้ำกับสีน้ำเงินของปุ่ม */
#bar1 .fld,#bar2 .fld{background:var(--teal);border-color:#0b5e57}
#bar1 .fld>label,#bar2 .fld>label{color:#fff}
/* ปุ่ม Save = น้ำเงิน, ประวัติ = ขาว, Excel = เขียว, Refresh = ฟ้าคราม, Reset = แดง */
.savebox button{background:var(--acc)}
.savebox button.alt,.modes .savebox button.alt{background:#fff;color:#334155;border:2px solid #94a3b8}
#xl{background:#15803d!important}
.modes .savebox #rf{color:#0e7490;border-color:#0e7490}
.modes .savebox #rf:hover{background:#0e7490;color:#fff}
/* ปุ่มสรุปข้อมูลสาขา / OS-Office = ม่วงอ่อน */
.bgrp #bb,.bgrp #bo{background:#fff;color:#0033ff;border:1px solid #0033ff;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer}
.bgrp #bb:hover,.bgrp #bo:hover{background:#0033ff;color:#fff}
/* ปุ่มล้างตัวกรอง = ขาวขอบแดง (แยกจากหัวกลุ่มสีน้ำเงิน) */
#fclr{background:#fff;border:2px solid var(--err);color:var(--err);font-weight:700}
#fclr:hover{background:var(--err);border-color:var(--err);color:#fff}
/* ช่องที่แก้ไขแล้ว = เหลืองอำพัน (ไม่ซ้ำกับสีโฟกัสสีน้ำเงิน) */
.chg input,.chg textarea,.chg select{border-color:var(--amb);background:#fff7e0;box-shadow:0 0 0 1px var(--amb)}
/* ช่องตรวจเครื่อง = เขียวอมฟ้าอ่อน */
.chk{border:2px solid var(--teal);background:#e6f6f3}
.chk>label{color:var(--teal)}
/* หัวกลุ่มตัวกรอง */
#fbox .fgh.g0{background:#1d4ed8}
/* รายการที่เลือก: เหลืองอ่อน + แถบน้ำเงินด้านซ้าย เห็นชัดกว่าเดิม */
.it:hover{background:#e8f0ff}
.it.sel{background:#f7c7ac;box-shadow:inset 4px 0 0 var(--amb)}
/* ตัวเลขสรุป */
#stats .r,#stats .r b{color:var(--acc)}
#stats .r.s,#stats .r.s b{color:#0f172a}
/* ตารางสรุป: หัวตารางที่ 1 น้ำเงิน, ที่ 2 teal */
#brn table{--tc:#e3ebff}
/* ป้ายชื่อตัวกรอง (Window / MS Office / Antivirus ...) เป็นตัวอักษรธรรมดา ไม่มีป้าย */
#fbox .fg>b,#fbox .fg.act>b{background:none;border:0;border-radius:0;padding:2px 0;color:var(--ink);font-weight:600}
#fbox .fg.act>b{color:var(--acc);font-weight:700}
#fbox .fg.act>b label,#fbox .fg>b label{color:inherit}
/* ===== ขยายหน้าจอรายละเอียดเครื่อง (ฝั่งขวา, เดสก์ท็อป) ให้อ่านง่ายขึ้น ===== */
@media(min-width:641px){
  #grid .panel{padding:16px 18px}
  #grid .ttl{font-size:19px}
  #grid .sub{font-size:15px;margin:0 0 6px 10px}
  #grid #panel .sec{padding:5px 12px;margin:14px 0 9px;font-size:15px;border-radius:6px}
  #grid #panel .f{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
  #grid #panel label{font-size:13px;margin-bottom:3px;line-height:1.3}

  #grid #panel .cb input{padding-right:30px}
  #grid #panel .cbb{width:28px;font-size:13px}

/* ===== หน้ารายละเอียดเครื่อง: วาง 3 ช่องต่อแถว ให้ข้อความในช่องแสดงครบ และพอดีกรอบหน้าจอ ===== */

/* ปุ่ม Save / ประวัติ / Print to Excel ตอนยังกดไม่ได้: เทาอ่อน ตัวอักษรเทาเข้ม อ่านชัด (ไม่จาง) */
.modes .savebox #sv:disabled,.modes .savebox #hs:disabled,#xl:disabled{opacity:1;background:#e2e8f0!important;color:#475569;border:2px solid #94a3b8;cursor:not-allowed}
/* Save ตอนกดได้: น้ำเงินเข้ม ตัวหนังสือขาวหนา */
.modes .savebox #sv:not(:disabled){background:var(--acc);color:#fff;font-weight:700;border:2px solid var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.modes .savebox #sv:not(:disabled):hover{background:#1e40af;border-color:#1e40af}
/* ขยายหน้ารายละเอียดเครื่องออกทางขวา: เอาเพดานความกว้างออก ลดขอบขวา และลดความกว้างรายการด้านซ้าย */
main{max-width:1564px;padding-right:14px}
@media(min-width:641px){
  #grid.grid{grid-template-columns:210px minmax(0,1fr)}

}
/* หัวรายการ (รหัส Asset ทั้งหมด — N รายการ) = แดงสด */
.list .head{color:#ff0000}

  body{font-size:16px}

  .top,.modes,.sidew{display:contents}
  /* ลำดับบนหน้าจอ: ปุ่มโหมด > ตัวเลือก > ปุ่มเครื่องมือ > สรุปสาขา > รายการ/รายละเอียด > สรุปจำนวน */
  .modes>button{order:1;flex:1 1 28%;width:auto;min-height:48px;padding:8px 4px;font-size:16px;text-align:center;border-radius:10px}
  .bars{order:2;flex:1 1 100%;width:100%}

  #stats .r{break-inside:avoid;padding:6px 0;font-size:14px}
  #stats .r b{font-size:15px}
  #stats .r.s{padding-left:10px}
  /* ปุ่มเครื่องมือ */
  .modes .savebox #xl,.modes .savebox #rf,.modes .savebox #rs{min-height:44px;padding:6px 4px;font-size:14px;border-radius:10px}
  .bgrp #bb,.bgrp #bo{flex:1;min-height:48px;font-size:14px;white-space:normal;border-radius:10px}
  /* Save / ประวัติ ลอยติดขอบล่างจอ (โผล่เมื่อเปิดเครื่องแล้ว) */
  .modes .savebox #sv,.modes .savebox #hs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;height:42px;padding:0 10px;font-size:15px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .modes .savebox #sv{left:10px;width:calc(45% - 14px)}
  .modes .savebox #hs{right:10px;width:calc(30% - 14px)}

  .modes #msg{position:fixed;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:21;margin:0;padding:8px 12px;font-size:15px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}

  /* ช่องกรอก/ตัวเลือก */
  input,select,textarea{font-size:16px}

  #bar1 .fld,#bar2 .fld{flex:1 1 100%}
  .fld>label{font-size:14.5px}
  /* รายการ */
  .list{max-height:45vh}
  .list .head{font-size:14px;padding:8px 12px}
  .it{padding:12px 14px}
  .it b{font-size:17px}
  .it span{font-size:14px}
  /* รายละเอียดเครื่อง */
  .panel{padding:12px}
  .ttl{font-size:21px}
  .sec{font-size:16px;padding:8px 12px}
  .f{grid-template-columns:1fr;gap:10px}
  .f>.wfull{width:100%}
  .panel select,.panel input{min-height:46px}
  .panel textarea{min-height:76px}
  .chk{padding:6px 10px 10px}
  /* หน้า Filter */
  #fwrap{flex-direction:column}
  #fbox{max-width:none}
  #fbox .fg{grid-template-columns:minmax(0,1fr);row-gap:6px;margin-bottom:14px}
  #fbox .fg>b{font-size:15px}
  #fbox .fgh{font-size:15px}
  #fbox .fo{flex-wrap:wrap;overflow:visible;gap:8px;padding:0}

  #fbox .fo label{padding:8px 12px;font-size:15px;gap:8px;border:1px solid var(--line);border-radius:999px;background:#fff}
  #fbox .fo input{width:20px;height:20px}
  #fbox .fsel{min-height:46px;font-size:16px}
  #fbox .fh{gap:8px;flex-wrap:wrap}
  #fbox .fh button{min-height:44px;font-size:14px;padding:6px 14px;border-radius:10px}
  #fres .list{max-height:45vh}
  /* หน้าต่างสรุป/ประวัติ */
  #brn{padding:12px;align-items:center}
  #brn .box{max-width:none;border-radius:14px;max-height:85vh;max-height:85dvh}
  #brn table{font-size:13px}
  #brn th,#brn td{padding:8px 4px}
  #cam button{padding:14px 28px;font-size:16px}

#stats .r.tot:hover{background:#f3f6ff}
#stats .tot .ar{display:inline-block;position:relative;width:17px;height:17px;border-radius:50%;background:#0033ff;margin-left:5px;vertical-align:middle;transition:transform .15s}
#stats .tot .ar::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translate(-50%,-70%) rotate(45deg)}
#stats.open .tot .ar{transform:rotate(-90deg)}
#stats .st-pop{display:none;position:absolute;top:0;left:calc(100% + 8px);width:175px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#stats.open .st-pop{display:block}
@media(max-width:640px){
  .sidew #stats{column-count:1}
  #stats .st-pop{position:static;width:auto;box-shadow:none;border:0;border-top:1px solid #eef0f4;border-radius:0;padding:4px 0 0;column-count:2;column-gap:16px}
}

.sidew #stats{width:auto;min-width:100%}
@media(max-width:640px){.sidew #stats{width:100%;min-width:0}}

/* หัวตารางในหน้าต่าง ข้อมูลเครื่องแต่ละสาขา / OS-MS Office: ตรึงไว้ ไม่เลื่อนตามรายการ */
#brn .bd table{border-collapse:separate;border-spacing:0}
#brn th{position:sticky;top:0;z-index:3;box-shadow:0 -10px 0 #fff}

/* หน้าต่าง OS-MS Office: ให้เห็นทุกบรรทัดโดยไม่ต้องเลื่อน (JS จะปรับ --py/--fs ให้พอดีความสูงจอ) */
#brn.os{--py:8px;--fs:14px}
#brn.os .box{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
#brn.os .hd{padding:8px 16px;flex:0 0 auto}
#brn.os .bd{padding-bottom:8px}
#brn.os table{font-size:var(--fs)}
#brn.os td{padding:var(--py) 4px}
#brn.os th{padding:calc(var(--py) + 2px) 6px}
#brn.os table{margin-top:0!important}
#brn.os .gap{height:calc(var(--py) + 4px)!important}
@media(max-width:640px){#brn.os{padding:0}#brn.os .box{max-height:100vh;max-height:100dvh;border-radius:0}}

/* หน้าต่างข้อมูลสาขา: เลือกสาขาแล้วแสดงรายละเอียด Location อีกหน้าต่างทางด้านขวา */
#brn #brs{display:none}
#brn.two{gap:12px}
#brn.two .box{max-width:none;width:auto;min-width:0}
#brn.two #brs{display:flex;flex:0 1 480px;animation:brsin .18s ease-out}
#brn.two .box:first-child{flex:0 1 620px}
/* หน้าต่างรายละเอียด Location (ด้านขวา): ให้เห็นครบทุกบรรทัดในหน้าเดียว ไม่ต้องเลื่อนขึ้นลง (JS ปรับ --py/--fs ให้พอดีความสูงจอ) */
#brn #brs{--py:8px;--fs:14px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
#brn #brs .hd{padding:8px 16px;flex:0 0 auto}
#brn #brs .bd{padding-bottom:8px;min-height:0}
#brn.two #brs{flex:0 0 auto;width:max-content;max-width:calc(100vw - 24px)}
#brn #brs .bd{overflow-x:auto}
#brn #brs table{font-size:var(--fs);width:auto;min-width:100%}
#brn #brs th,#brn #brs td{white-space:nowrap}
#brn #brs td:first-child{padding-right:20px}
#brn #brs td{padding-top:var(--py);padding-bottom:var(--py)}
#brn #brs th{padding-top:calc(var(--py) + 2px);padding-bottom:calc(var(--py) + 2px)}
/* หน้าต่าง OS-MS Office: ความกว้างขยายตามข้อมูลที่ยาวที่สุด แต่ไม่เกินหน้าจอ · ข้อความอยู่บรรทัดเดียว */
#brn.os .box{width:max-content;max-width:calc(100vw - 24px)}
#brn.os .bd{overflow-x:auto}
#brn.os th,#brn.os td{white-space:nowrap}
#brn.os td:first-child{padding-right:24px}
@media(max-width:640px){#brn.os .box{max-width:100vw}}
/* ปรับช่องไฟตัวเลขและขอบให้โปร่งอ่านง่าย */
#brn.os .bd{padding-left:20px;padding-right:20px}
#brn.os th,#brn.os td{padding-left:10px;padding-right:10px}
#brn.os th:not(:first-child),#brn.os td:not(:first-child){min-width:48px}
#brn.os th:first-child,#brn.os td:first-child{padding-left:14px;padding-right:28px}
#brn.os th:last-child,#brn.os td:last-child{padding-right:18px}
#brn.os td:last-child,#brn.os th:last-child{min-width:56px}
/* มือถือ: หน้าต่าง OS-MS Office ให้พอดีความกว้างจอ ไม่ต้องเลื่อนซ้าย-ขวา (ชื่อรายการขึ้นบรรทัดใหม่ได้ ตัวเลขชิดกัน) */
@media(max-width:640px){
  #brn.os{padding:8px}
  #brn.os .box{width:100%;max-width:none;border-radius:12px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  #brn.os .bd{padding:0 6px 8px;overflow-x:hidden;overflow-y:auto}
  #brn.os table{width:100%;min-width:0}
  #brn.os th,#brn.os td{padding-left:3px;padding-right:3px}
  #brn.os th:first-child,#brn.os td:first-child{white-space:normal;word-break:break-word;min-width:76px;padding-left:6px;padding-right:4px;text-align:left}
  #brn.os th:not(:first-child),#brn.os td:not(:first-child){min-width:0;padding-left:3px;padding-right:3px;text-align:right}
  #brn.os th:last-child,#brn.os td:last-child{min-width:0;padding-right:6px}
}
/* ช่อง Dropdown ในหน้า Filter (Location, Antivirus ฯลฯ): ย่อ/ขยายตามความยาวของข้อมูล ไม่เกินความกว้างของหน้าจอ */
#fbox .fg>div:has(>select.fsel){min-width:0}
#fbox select.fsel{width:auto;min-width:min(160px,100%);max-width:100%;padding-right:28px;text-overflow:ellipsis}
@keyframes brsin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
#brn tr.br.sel td{background:#e8edfa}
#brn tr.br.sel .car{color:var(--acc)}
#brs .hd span small{font-weight:400;color:var(--mut);margin-left:6px}
#brn tr.lcr td:first-child{word-break:normal}
@media(max-width:640px){
  #brn.two .box:first-child{display:none}
  #brn.two #brs{flex:0 1 auto;max-width:calc(100vw - 24px)}
}
/* หน้าจอคอม (กว้างตั้งแต่ ~1100px): จัดช่องรายละเอียดเครื่อง 4 ช่องต่อแถว + ลดช่องไฟแนวตั้ง ให้เห็นครบทั้งหน้าโดยไม่ต้องเลื่อนขึ้นลง */
@media(min-width:900px){
  main{padding-top:8px}
  .bar{margin-bottom:6px}
  #grid #panel .f{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px}
  #grid #panel .f>.kc{grid-column:span 2}
  #grid .panel{padding:6px 12px 8px}
  #grid #panel .sec{padding:2px 10px;margin:6px 0 4px;font-size:14px}
  #grid .ttl{font-size:16px}
  #grid #panel input,#grid #panel select{height:30px;padding:1px 6px;font-size:13.5px}
  #grid #panel textarea{min-height:30px;padding:3px 8px;font-size:13.5px}
  #grid #panel label{font-size:12px;margin-bottom:0}
  #grid #panel .chk{padding:1px 6px 3px}
  #grid #panel .asw .awx{height:30px}
  #grid #panel .asw .awr{margin-bottom:3px}
  #grid #panel .asw .awa{padding:2px 12px;font-size:12.5px}
}
/* จอเตี้ย / แท็บเล็ตแนวนอน: ย่อความสูงเพิ่มอีกขั้น */
@media(min-width:900px) and (max-height:820px){
  main{padding-top:4px}
  .bar{margin-bottom:4px}
  .bar .fld{padding:3px 8px}
  .fld>label{font-size:11.5px;margin-bottom:1px}
  .bar select,.bar input{padding:3px 8px}
  #grid #panel .f{gap:2px 6px}
  #grid .panel{padding:4px 10px 6px}
  #grid #panel .sec{margin:4px 0 3px;font-size:13px;padding:1px 10px}
  #grid #panel input,#grid #panel select{height:27px;font-size:13px;padding:0 5px}
  #grid #panel textarea{min-height:27px;font-size:13px;padding:2px 6px}
  #grid #panel label{font-size:11.5px;line-height:1.1}
  #grid #panel .chk{padding:0 5px 2px}
  #grid #panel .asw .awx{height:27px}
  #grid #panel .asw .awr{margin-bottom:2px}
  #grid #panel .asw .awh{display:none}
  #grid .ttl{font-size:15px}
}
/* หน้า Filter (คอม/โน้ตบุ๊ก/แท็บเล็ตแนวนอน): ย่อช่องไฟแนวตั้งให้เห็นตัวกรองครบทั้งหน้า ไม่ต้องเลื่อน */
@media(min-width:900px){
  #fbox .fh{margin-bottom:4px}
  #fbox .fh button,#fxl,#fclr{padding:2px 10px;font-size:12.5px}
  #fbox .fgh{margin:10px 0 5px;padding:1px 12px;font-size:12.5px}
  #fbox .fh+.fgh{margin-top:0}
  #fbox .fg{margin-bottom:5px;grid-template-columns:122px minmax(0,1fr);align-items:center}
  #fbox .fg>b,#fbox .fg.act>b{padding:0;font-size:12.5px;white-space:nowrap}
  #fbox .fo{gap:1px 12px}
  #fbox .fo.v{gap:1px 16px}
  #fbox .fo label{padding:0;font-size:13.5px;line-height:1.3}
  #fbox .fo input{width:14px;height:14px}
  #fbox select.fsel{padding:1px 24px 1px 8px;font-size:13px;min-height:24px}
  #fres .list{height:calc(100vh - 56px)}
  #fres #grid #panel .f{grid-template-columns:repeat(3,minmax(0,1fr))}
  #fres #grid #panel .f>.kc{grid-column:span 2}
}
@media(min-width:900px) and (max-width:1199px){
  #fres #grid.grid{grid-template-columns:140px minmax(0,1fr)}
  #fbox{max-width:38%}
  #fres #grid.grid{grid-template-columns:118px minmax(0,1fr)}
}
/* จอเตี้ยมาก (เช่น โน้ตบุ๊ก 13" ที่ซูม 100%): ย่อเพิ่มอีกขั้น */
@media(min-width:900px) and (max-height:720px){
  header{padding:6px 14px}
  .modes button{padding:5px 10px}
  .bar .fld{padding:2px 8px}
  #grid #panel .f{gap:1px 6px}
  #grid .panel{padding:2px 10px 4px}
  #grid #panel .sec{margin:3px 0 2px;padding:0 10px;font-size:12.5px}
  #grid #panel input,#grid #panel select{height:24px;font-size:12.5px}
  #grid #panel textarea{min-height:24px;font-size:12.5px}
  #grid #panel label{font-size:10.5px}
  #grid #panel .asw .awx{height:24px}
  #grid #panel .asw .awa{padding:0 10px;font-size:12px}
  #grid .ttl{font-size:14px}
}
/* ปุ่มประวัติแก้ไขทั้งหมด: สไตล์เดียวกับปุ่มล้างค่า แต่เป็นสีน้ำเงินสด */
#fhs{background:#fff;border:2px solid #0033ff;color:#0033ff;font-weight:700;cursor:pointer}
#fhs:hover{background:#0033ff;border-color:#0033ff;color:#fff}
/* ระยะห่างระหว่างปุ่มในแถบ Filter */
#fbox .fh{gap:8px 18px;flex-wrap:wrap;margin-bottom:10px}
/* หน้า Filter: หัวกลุ่มเป็นแถบเส้นสีเต็มความกว้าง + เส้นคั่นบาง ๆ ระหว่างแต่ละหัวข้อ ให้แยกสัดส่วนชัด */
#fbox .fgh{display:block;width:auto;background:none!important;color:var(--c,#1d4ed8);border-bottom:2px solid var(--c,#1d4ed8);border-radius:0;padding:0 2px 2px;margin:8px 0 3px;font-size:14px;font-weight:700}
#fbox .fgh.g0{--c:#1d4ed8}#fbox .fgh.g1{--c:#15803d}#fbox .fgh.g2{--c:#7e22ce}#fbox .fgh.g3{--c:#c2410c}
#fbox .fh+.fgh{margin-top:4px}
#fbox .fg{margin-bottom:0;padding:2px 0;border-bottom:1px solid #d5dcea;align-items:center}
#fbox .fg>b,#fbox .fg.act>b{align-self:stretch;display:flex;align-items:center;border-right:1px solid #d5dcea;padding-right:6px}
#fbox .fg:last-child{border-bottom:0}
#fbox .fg:hover{background:#f6f8fc}
/* ประวัติแก้ไขทั้งหมด: แสดงเป็นแถวบรรทัดเดียว ขยายหน้าต่างตามความกว้างของข้อมูล */
#hist .box:has(table.hall){width:max-content;max-width:calc(100vw - 24px);min-width:min(760px,calc(100vw - 24px))}
#hist table.hall th,#hist table.hall td{white-space:nowrap;padding:8px 14px 8px 8px}
#hist table.hall td:nth-child(4){white-space:nowrap}
#hist table.hall td:first-child,#hist table.hall th:first-child{padding-left:4px}
/* ปุ่มหมายเหตุ (หน้า Filter) + ตารางหมายเหตุ */
#fnt{background:#fff;border:2px solid #0f766e;color:#0f766e;font-weight:700;cursor:pointer}
#fnt:hover{background:#0f766e;border-color:#0f766e;color:#fff}
#hist table.hnote td:nth-child(5){white-space:normal;min-width:260px;max-width:620px;word-break:break-word}
/* ตารางหมายเหตุ: หัวตารางสีเขียวอมฟ้า ลายสลับแถว เส้นกรอบอ่อน ป้ายสี Status */
#hist table.hnote{border-collapse:separate;border-spacing:0;border:1px solid #9fd3cc}
#hist table.hnote th{background:#0f766e;color:#fff;font-weight:700;top:54px;z-index:3;border-right:1px solid #3f9a91;border-bottom:0;padding-top:10px;padding-bottom:10px}
#hist table.hnote th:last-child{border-right:0}
#hist table.hnote td{border-bottom:1px solid #cfe7e3;border-right:1px solid #e1f0ee}
#hist table.hnote td:last-child{border-right:0}
#hist table.hnote tbody tr:nth-child(even) td{background:#f0f8f7}
#hist table.hnote tbody tr:hover td{background:#d9f0ec}
#hist table.hnote td:first-child{font-weight:600}
/* เมนูรวม (มือถือ ≤640px): ปุ่ม เมนู เปิดรายการสไลด์จากขวามือ — จอคอม/แท็บเล็ตไม่แสดงปุ่มนี้ */
.mnuw{display:none}
#drw{position:fixed;inset:0;z-index:900;visibility:hidden;pointer-events:none;transition:visibility 0s .25s}
#drw.on{visibility:visible;pointer-events:auto;transition-delay:0s}
#drw .dbk{position:absolute;inset:0;background:rgba(15,23,42,.45);opacity:0;transition:opacity .25s}
#drw .dpn{position:absolute;top:0;right:0;bottom:0;width:min(82vw,320px);background:#fff;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
#drw.on .dbk{opacity:1}
#drw.on .dpn{transform:none}
#drw .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
#drw .dh button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
#drw .db{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#drb button{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;text-align:center;margin:0;white-space:normal}
#drb #xl{border:0}
#drb #rf{background:#fff;color:var(--acc);border:2px solid var(--acc)}
#drb #rs{background:#fff;color:var(--err);border:2px solid var(--err)}
#drb .bbtn{background:#fff;color:#1d4ed8;border:2px solid #1d4ed8}
#drb button:disabled{opacity:.5}
#drb .sidew{display:flex;flex-direction:column;gap:10px;width:100%;margin:0;flex:none}
#drb .bgrp{display:flex;flex-direction:column;gap:10px;flex:none;width:100%;margin:0;order:0}
#drb .bgrp #bb,#drb .bgrp #bo{flex:none;width:100%;min-height:0;padding:12px;font-size:15px;white-space:normal;border-radius:8px}
#drb #stats{display:block;column-count:1;flex:none;order:0;width:100%;min-width:0;margin:0;font-size:13px}
@media(max-width:640px){
  #m3,#xl{display:none!important}
  .modes>.mnuw{display:block;order:1;flex:1 1 28%}
  .mnuw #mnu{width:100%;min-height:48px;padding:8px 4px;font:inherit;font-size:16px;font-weight:600;text-align:center;border-radius:10px;border:2px solid #94a3b8;background:#fff;color:#334155;cursor:pointer}
}
/* มือถือ (จอ ≤640px เช่น 6.7 นิ้ว): แต่ละแถวเป็นการ์ด — บน: Asset + Status / กลาง: Location + ผู้ถือครอง / ล่าง: หมายเหตุ 2 บรรทัด แตะเพื่อขยาย */
@media(max-width:640px){
  #hist .box:has(table.hall.hnote){width:calc(100vw - 24px);min-width:0}
  #hist table.hnote,#hist table.hnote tbody{display:block;width:100%;border:0}
  #hist table.hnote thead{display:none}
  #hist table.hnote tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:9px 6px;border-bottom:1px solid #cfe7e3;cursor:pointer}
  #hist table.hnote tbody tr:nth-child(even){background:#f0f8f7}
  #hist table.hnote td,#hist table.hnote tbody tr:nth-child(even) td,#hist table.hnote tbody tr:hover td{display:block;padding:0;border:0;background:none;font-size:13px;min-width:0;max-width:none;white-space:normal;word-break:break-word}
  #hist table.hnote td:nth-child(1){grid-column:1;grid-row:1;font-size:14px}
  #hist table.hnote td:nth-child(2){grid-column:2;grid-row:1;justify-self:end}
  #hist table.hnote td:nth-child(3){grid-column:1;grid-row:2;color:#475569}
  #hist table.hnote td:nth-child(4){grid-column:2;grid-row:2;justify-self:end;text-align:right;color:#475569}
  #hist table.hnote td:nth-child(5){grid-column:1 / -1;grid-row:3;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  #hist table.hnote tr.open td:nth-child(5){display:block;overflow:visible}
  #hist table.hnote td:empty{display:none}
  #hist .sb{padding:1px 8px;font-size:12px}
}
#hist .sb{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent}
#hist .sb.ok{background:#dcfce7;color:#166534;border-color:#86efac}
#hist .sb.lo{background:#fef3c7;color:#92400e;border-color:#fcd34d}
#hist .sb.bad{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
#hist .sb.em{background:#eef0f4;color:#475569;border-color:#cbd5e1}
#hist .sb.ot{background:#e0e7ff;color:#3730a3;border-color:#a5b4fc}
/* เฉพาะ iPad แนวตั้ง (html.ipad, 641–899px) โหมด Filter: รายการอยู่บน รายละเอียดอยู่ล่าง ให้ช่องกรอกมีที่พอ ไม่ติดกัน */
@media(min-width:641px) and (max-width:899px){
  html.ipad #fres #grid.grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"list" "p1";gap:10px}
  html.ipad #fres #grid #left{position:static}
  html.ipad #fres #grid .list{height:auto;max-height:30vh}
  html.ipad #fres #grid #panel .f{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
  html.ipad #fres #grid #panel .f>.kc{grid-column:1/-1}
  html.ipad #fres #grid .panel{padding:10px 12px}
  html.ipad #fres #grid .ttl{font-size:17px;display:block;word-break:break-all}

const inBranch=(r,b)=>{

const rowBranch=r=>{

};

const locInBranch=(l,b)=>!!(BRLOC[b]&&BRLOC[b].has(l))||branchOf(l)===branchOf(b);

function autoFit(el){
  if(!el)return;
  if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=el.scrollHeight+'px';return;}
  const w=el.closest('.kc'); if(!w||!PCQ.matches)return;
  const cb=el.closest('.cb'); if(!cb)return;
  // วัดความกว้างข้อความจริง แล้วปรับกล่องให้พอดี (เผื่อขอบซ้าย + ปุ่มลูกศรด้านขวา)
  const cs=getComputedStyle(el),cx=autoFit._c||(autoFit._c=document.createElement('canvas').getContext('2d'));
  cx.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  const need=Math.ceil(cx.measureText(el.value||'').width)+(parseFloat(cs.paddingLeft)||6)+34+14;
  const par=w.parentNode,pcs=getComputedStyle(par),gap=parseFloat(pcs.columnGap)||8;
  const cols=pcs.gridTemplateColumns.split(' ').length||1;
  const colW=(par.clientWidth-gap*(cols-1))/cols;
  const span=Math.min(cols,Math.max(1,Math.ceil((need+gap)/(colW+gap))));
  w.style.gridColumn='span '+span;
  cb.style.width=Math.max(160,need)+'px';cb.style.maxWidth='100%';
}

function awParse(v){

    const k=x.indexOf('|'); return k<0?[x,'']:[x.slice(0,k).trim(),x.slice(k+1).trim()];
  });
}

}
function awSync(box){

async function toCanvas(src,zm){
  let w,h,draw;
  if(src instanceof HTMLVideoElement){const z=zm>1?zm:1,vw=src.videoWidth,vh=src.videoHeight;w=Math.round(vw/z);h=Math.round(vh/z);const sx=(vw-w)/2,sy=(vh-h)/2;draw=(c,cw,ch)=>c.drawImage(src,sx,sy,w,h,0,0,cw,ch);} // ครอปตามระดับซูมแบบดิจิทัล ภาพที่ได้ตรงกับที่เห็น
  else{const bm=await createImageBitmap(src);w=bm.width;h=bm.height;draw=(c,cw,ch)=>c.drawImage(bm,0,0,cw,ch);}
  const k=Math.min(1,1600/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  draw(cv.getContext('2d'),cv.width,cv.height);
  return cv;
}
const ocrClean=t=>String(t||'').replace(/[^A-Za-z0-9\-_\/.]/g,'').replace(/^[-_.\/]+|[-_.\/]+$/g,'');
const ocrNorm=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
// เตรียมภาพก่อนอ่าน: ขยาย + ปรับคอนทราสต์ (gray) หรือแปลงเป็นขาว-ดำแบบปรับตามแสงรอบจุด (bin) ช่วยกรณีพื้นสีเขียว/มีขอบดำ/แสงไม่เท่ากัน
function ocrPrep(cv,mode){
  const k=Math.max(1,Math.min(2.5,1600/Math.max(cv.width,cv.height)));
  const c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);
  const cx=c.getContext('2d',{willReadFrequently:true});cx.imageSmoothingQuality='high';cx.drawImage(cv,0,0,c.width,c.height);
  const W=c.width,H=c.height,n=W*H,im=cx.getImageData(0,0,W,H),d=im.data,g=new Uint8Array(n);
  for(let i=0,j=0;i<n;i++,j+=4)g[i]=(d[j]*0.299+d[j+1]*0.587+d[j+2]*0.114)|0;
  const hist=new Array(256).fill(0);for(let i=0;i<n;i++)hist[g[i]]++;
  let lo=0,hi=255,acc=0;const t=n*0.02;
  for(;lo<255;lo++){acc+=hist[lo];if(acc>t)break;}
  acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>t)break;}
  const sc=hi>lo?255/(hi-lo):1;
  for(let i=0;i<n;i++)g[i]=Math.max(0,Math.min(255,((g[i]-lo)*sc)|0));
  let out=g;
  if(mode==='bin'){
    const S=new Float64Array((W+1)*(H+1));
    for(let y=0;y<H;y++){let r=0;for(let x=0;x<W;x++){r+=g[y*W+x];S[(y+1)*(W+1)+x+1]=S[y*(W+1)+x+1]+r;}}
    const rad=Math.max(8,Math.round(Math.min(W,H)/16));out=new Uint8Array(n);
    for(let y=0;y<H;y++){const y0=Math.max(0,y-rad),y1=Math.min(H,y+rad+1);
      for(let x=0;x<W;x++){const x0=Math.max(0,x-rad),x1=Math.min(W,x+rad+1);
        const m=(S[y1*(W+1)+x1]-S[y0*(W+1)+x1]-S[y1*(W+1)+x0]+S[y0*(W+1)+x0])/((y1-y0)*(x1-x0));
        out[y*W+x]=g[y*W+x]<m*0.85?0:255;}}
  }
  for(let i=0,j=0;i<n;i++,j+=4){d[j]=d[j+1]=d[j+2]=out[i];d[j+3]=255;}
  cx.putImageData(im,0,0);return c;
}
function lev(a,b){
  const m=a.length,n=b.length,dp=[];for(let j=0;j<=n;j++)dp[j]=j;
  for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}
  return dp[n];
}
// อ่านข้อความจากภาพ แล้วจับคู่กับรหัส Asset ที่มีอยู่จริงในระบบ (ทนต่อการอ่านผิด 1-2 ตัว เช่น O/0, I/1, S/5)
// หาแผ่นป้าย/สติกเกอร์ในภาพ ทั้งแบบสีสด (เช่น เขียว) และแบบสีขาว/สว่าง: คืนรายการ (สูงสุด 3) ที่เป็นสี่เหลี่ยมผืนผ้า พร้อมตำแหน่ง ขนาด มุมเอียง
function findSticker(cv){
  const k=Math.min(1,400/Math.max(cv.width,cv.height));
  const w=Math.max(1,Math.round(cv.width*k)),h=Math.max(1,Math.round(cv.height*k)),n=w*h;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(cv,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data;
  const tests=[
    (mx,mn)=>mx>=110&&(mx-mn)>=0.35*mx,   // สีสด
    (mx,mn)=>mx>=150&&(mx-mn)<=0.25*mx    // สว่าง/ขาว
  ],res=[];
  tests.forEach((tf,mi)=>{
    const m=new Uint8Array(n);
    for(let i=0,j=0;i<n;i++,j+=4){const mx=Math.max(d[j],d[j+1],d[j+2]),mn=Math.min(d[j],d[j+1],d[j+2]);if(tf(mx,mn))m[i]=1;}
    const lab=new Int32Array(n),stack=new Int32Array(n),cnts=[0];let L=0;
    for(let s0=0;s0<n;s0++){
      if(!m[s0]||lab[s0])continue;
      L++;let sp=0,cnt=0;stack[sp++]=s0;lab[s0]=L;
      while(sp){
        const p=stack[--sp];cnt++;const px=p%w,py=(p-px)/w;
        if(px>0&&m[p-1]&&!lab[p-1]){lab[p-1]=L;stack[sp++]=p-1;}
        if(px<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=L;stack[sp++]=p+1;}
        if(py>0&&m[p-w]&&!lab[p-w]){lab[p-w]=L;stack[sp++]=p-w;}
        if(py<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=L;stack[sp++]=p+w;}
      }
      cnts[L]=cnt;
    }
    const ids=[];for(let l=1;l<=L;l++)if(cnts[l]>=n*0.008&&cnts[l]<=n*(mi?0.3:0.6))ids.push(l);
    ids.sort((x,y)=>cnts[y]-cnts[x]);
    ids.slice(0,4).forEach(id=>{
      let mx=0,my=0;
      for(let i=0;i<n;i++)if(lab[i]===id){mx+=i%w;my+=(i/w)|0;}
      mx/=cnts[id];my/=cnts[id];
      let cxx=0,cyy=0,cxy=0;
      for(let i=0;i<n;i++)if(lab[i]===id){const dx=i%w-mx,dy=((i/w)|0)-my;cxx+=dx*dx;cyy+=dy*dy;cxy+=dx*dy;}
      let th=0.5*Math.atan2(2*cxy,cxx-cyy);
      if(th>Math.PI/4)th-=Math.PI/2;else if(th<-Math.PI/4)th+=Math.PI/2;
      const ux=Math.cos(th),uy=Math.sin(th);
      let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
      for(let i=0;i<n;i++)if(lab[i]===id){
        const dx=i%w-mx,dy=((i/w)|0)-my,u=dx*ux+dy*uy,v=-dx*uy+dy*ux;
        if(u<u0)u0=u;if(u>u1)u1=u;if(v<v0)v0=v;if(v>v1)v1=v;
      }
      const bl=u1-u0+1,bw=v1-v0+1,fill=cnts[id]/(bl*bw),ratio=bl/bw;
      if(fill<0.6||ratio<1.4||ratio>12)return; // ไม่ใช่รูปทรงป้าย
      const uc=(u0+u1)/2,vc=(v0+v1)/2;
      res.push({th,cx:(mx+uc*ux-vc*uy)/k,cy:(my+uc*uy+vc*ux)/k,L:bl/k,W:bw/k,score:cnts[id]*fill});
    });
  });
  res.sort((a,b)=>b.score-a.score);
  return res.slice(0,3);
}
// ตัดเฉพาะแผ่นสติกเกอร์ หมุนให้ตัวหนังสืออยู่แนวนอน และขยายให้ใหญ่พอ
function cropSticker(cv,st){
  const wc=st.L*0.96,hc=st.W*0.9,sc=Math.min(4,Math.max(1,900/wc));
  const o=document.createElement('canvas');o.width=Math.max(1,Math.round(wc*sc));o.height=Math.max(1,Math.round(hc*sc));
  const x=o.getContext('2d');x.imageSmoothingQuality='high';
  x.translate(o.width/2,o.height/2);x.rotate(-st.th);x.scale(sc,sc);x.translate(-st.cx,-st.cy);x.drawImage(cv,0,0);
  return o;
}
// แปลงเป็นขาว-ดำด้วย Otsu (ตัวหนังสือดำบนพื้นขาว) + เว้นขอบขาว
function binOtsu(c){
  const W=c.width,H=c.height,n=W*H,cx=c.getContext('2d',{willReadFrequently:true}),im=cx.getImageData(0,0,W,H),d=im.data,g=new Uint8Array(n),hist=new Array(256).fill(0);
  for(let i=0,j=0;i<n;i++,j+=4){g[i]=(d[j]*0.299+d[j+1]*0.587+d[j+2]*0.114)|0;hist[g[i]]++;}
  let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];
  let wB=0,sB=0,mxv=-1,th=127;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mxv){mxv=v;th=t;}}
  for(let i=0,j=0;i<n;i++,j+=4){const v=g[i]>th?255:0;d[j]=d[j+1]=d[j+2]=v;d[j+3]=255;}
  const P=Math.round(Math.min(W,H)*0.2),o=document.createElement('canvas');o.width=W+2*P;o.height=H+2*P;
  const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,o.width,o.height);ox.putImageData(im,P,P);
  return o;
}
// แก้ตัวอักษรที่ OCR มักสับสนให้เป็นรูปแบบรหัส เช่น PC-1-61-210 / 99-002127 (ส่วนที่มีตัวเลขปน แปลงตัวอักษรหน้าตาคล้ายเลขให้เป็นเลข; ส่วนที่เป็นตัวอักษรล้วนเก็บไว้); คืน '' ถ้าไม่เข้ารูปแบบ
function fixCode(t){
  const ps=String(t||'').replace(/\s+/g,'').split(/[-_.\u2010-\u2015~]+/).filter(Boolean);
  if(ps.length<2||ps.length>6)return '';
  const dg={O:'0',o:'0',Q:'0',D:'0',I:'1',l:'1','|':'1',i:'1',S:'5',s:'5',B:'8',Z:'2',z:'2',G:'6'};
  const out=ps.map((x,i)=>{
    if(!/^[A-Za-z0-9|]+$/.test(x))return null;
    if(/^[A-Za-z]{1,5}$/.test(x)&&i===0&&ps.length>=2&&!/^[OoQDIliSsBZzG]{1,2}$/.test(x))return x.toUpperCase();
    return x.replace(/[OoQDIli|SsBZzG]/g,c=>dg[c]);
  });
  if(out.some(x=>x===null))return '';
  if(!/^\d+$/.test(out[out.length-1]))return '';
  const r=out.join('-');
  return r.replace(/-/g,'').length>=5?r:'';
}
// อ่านข้อความจากภาพ: คืนข้อความบรรทัดที่ตัวอักษรใหญ่ที่สุด (ตัวที่อยู่หน้าสุด) แบบดิบ ครบทุกตัวที่อ่านได้ ไม่แก้ ไม่เทียบกับข้อมูลในระบบ
// ตัดเฉพาะป้าย/สติกเกอร์ก่อน อ่านหลายรอบ แล้วเลือกข้อความที่อ่านได้ตรงกันมากที่สุด
async function ocrBest(src){
  await loadTess();
  const cv=await toCanvas(src);
  // บรรทัดที่ตัวสูงที่สุดในหน้านั้น (ตัดช่องว่างออก ไม่เปลี่ยนตัวอักษร)
  const biggest=data=>{
    let ls=(data.lines||[]).map(l=>({t:String(l.text||'').replace(/\s+/g,''),h:l.bbox?(l.bbox.y1-l.bbox.y0):0}));
    if(!ls.length)ls=String(data.text||'').split(/\n/).map(t=>({t:t.replace(/\s+/g,''),h:0}));
    ls=ls.filter(l=>l.t.length>=3&&/[A-Za-z0-9]/.test(l.t));
    if(!ls.length)return '';
    ls.sort((x,y)=>y.h-x.h||y.t.length-x.t.length);
    return ls[0].t;
  };
  let crs=[];
  try{crs=findSticker(cv).map(st=>cropSticker(cv,st));}catch(e){crs=[];}
  const passes=[];
  crs.forEach((cr,i)=>{
    passes.push([()=>binOtsu(cr),'7',2],[()=>binOtsu(cr),'6',2]);
    if(i===0)passes.push([()=>ocrPrep(cr,'gray'),'7',1]);
  });
  passes.push([()=>ocrPrep(cv,'gray'),'6',1],[()=>ocrPrep(cv,'bin'),'6',1],[()=>ocrPrep(cv,'bin'),'11',1]);
  const wk=await Tesseract.createWorker('eng');
  const votes={};
  const topOf=()=>Object.keys(votes).sort((x,y)=>votes[y]-votes[x]||y.length-x.length)[0];
  try{
    await wk.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_/.'});
    for(const [mk,psm,wt] of passes){
      if(wt===1&&psm!=='7'&&Object.keys(votes).length)break; // อ่านได้แล้ว ไม่ต้องอ่านทั้งภาพเพิ่ม
      await wk.setParameters({tessedit_pageseg_mode:psm});
      const t=biggest((await wk.recognize(mk())).data);
      if(!t)continue;
      votes[t]=(votes[t]||0)+wt;
      if(votes[t]>=3&&topOf()===t)return t; // อ่านได้ตรงกันหลายรอบ
    }
  }finally{try{await wk.terminate();}catch(e){}}
  return topOf()||'';
}
async function runOcr(src){
  const m=$('msg');m.className='';m.textContent='กำลังอ่านข้อความ…';
  try{
    const t=await ocrBest(src);
    if(!t){m.className='bad';m.textContent='ไม่พบข้อความที่ชัดพอ';return false;}
    m.className='ok';m.textContent='อ่านได้: '+t;applyVal(scanTarget,t);return true;
  }catch(e){m.className='bad';m.textContent=e.message;return false;}
}
// สแกนจากภาพนิ่ง (ภาพที่ถ่าย หรือรูปในเครื่อง): 1) อ่านบาร์โค้ด/QR 2) ถ้าไม่เจอ อ่านข้อความและเลือกคำที่ชัดที่สุด
async function scanImage(src){
  const m=$('msg');m.className='';m.textContent='กำลังสแกนภาพ…';
  let file=src;
  if(src instanceof HTMLCanvasElement){
    const bl=await new Promise(r=>src.toBlob(r,'image/jpeg',0.92));
    file=new File([bl],'shot.jpg',{type:'image/jpeg'});
  }
  try{
    const t=String(await decodeFile(file)).trim();
    if(t){m.className='ok';m.textContent='สแกนได้: '+t;applyVal(scanTarget,t);return true;}
  }catch(e){}
  return runOcr(src instanceof HTMLCanvasElement?src:file);
}

function fitBrs(){
  const m=$('brs'), bd=$('brsb');
  const steps=[[8,14],[7,14],[6,13],[5,13],[4,12],[3,12],[3,11],[2,11],[2,10],[1,10],[0,9]];
  for(const [py,fs] of steps){
    m.style.setProperty('--py',py+'px'); m.style.setProperty('--fs',fs+'px');
    if(bd.scrollHeight<=bd.clientHeight+1&&bd.scrollWidth<=bd.clientWidth+1) break;
  }
}
window.addEventListener('resize',()=>{if($('brn').classList.contains('two')&&$('brn').style.display!=='none')fitBrs();});
$('bbd').onclick=e=>{
  const tr=e.target.closest('tr.br.has'); if(!tr)return;
  if(tr.classList.contains('sel')){closeBrs();return;}
  $('bbd').querySelectorAll('tr.br.sel').forEach(x=>{x.classList.remove('sel');x.querySelector('.car').textContent='▸';});
  tr.classList.add('sel'); tr.querySelector('.car').textContent='▶';
  openBrs(+tr.dataset.i);

$('brsx').onclick=closeBrs;
function showOsOffice(){
  $('brt').textContent='ข้อมูล OS-MS Office';
  const L=LOC(), cols=[['OS (Window)',col('Window')],['MS Office',col('MS Office')]];
  const has={}; const data=cols.map(()=>({}));
  R.forEach(r=>{
    let b=branchOf(r.v[L]); if(!BRANCHES.includes(b)) b='อื่น ๆ'; has[b]=1;
    cols.forEach(([,ci],k)=>{
      const v=(ci>=0?String(r.v[ci]??'').trim():'')||'(ไม่ระบุ)';
      const o=data[k][v]=data[k][v]||{t:0}; o[b]=(o[b]||0)+1; o.t++;
    });
  });
  const bs=BRANCHES.concat(has['อื่น ๆ']?['อื่น ๆ']:[]);
  const tbl=([title],k)=>{
    // เรียงเวอร์ชันเก่า → ใหม่ (รุ่นปกติก่อน OEM/E3) · Mac ต่อท้าย Windows · No Office และ (ไม่ระบุ) อยู่ท้ายสุด
    const rk=v=>{
      if(v==='(ไม่ระบุ)')return [3,0];
      if(/no\s*office/i.test(v))return [2,0];
      let m;
      if(/365/.test(v))return [0,-9999];
      if((m=v.match(/windows\s*(\d+)/i)))return [0,-(+m[1])];
      if((m=v.match(/(20\d\d)/)))return [0,-(+m[1])];
      if((m=v.match(/(\d+(?:\.\d+)?)\s*$/)))return [1,-parseFloat(m[1])];
      return [1,0];
    };
    const vr=v=>/oem|\be\d\b/i.test(v)?1:0;
    const keys=Object.keys(data[k]).sort((x,y)=>{
      const a=rk(x),b=rk(y);
      return a[0]-b[0]||b[1]-a[1]||vr(x)-vr(y)||data[k][y].t-data[k][x].t||x.localeCompare(y,'th');
    });
    const T={t:0}; 
    const rows=keys.map(v=>{const o=data[k][v];T.t+=o.t;bs.forEach(b=>T[b]=(T[b]||0)+(o[b]||0));
      return `<tr><td>${esc(v)}</td>${bs.map(b=>`<td>${o[b]||0}</td>`).join('')}<td><b>${o.t}</b></td></tr>`;}).join('');
    return `<table class="${k?'t2':''}" style="margin-top:8px"><thead><tr><th>${esc(title)}</th>${bs.map(b=>`<th>${esc(BRN_LABEL[b]||b)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${rows||'<tr><td colspan="'+(bs.length+2)+'">ไม่มีข้อมูล</td></tr>'}<tr class="tot"><td>รวมทั้งหมด</td>${bs.map(b=>`<td>${T[b]||0}</td>`).join('')}<td>${T.t}</td></tr></tbody></table>`;
  };
  $('bbd').innerHTML=cols.map(tbl).join('<div class="gap"></div>');
  closeBrs();
  $('brn').classList.add('os');
  $('brn').style.display='flex';
  fitOsOffice();
}
// ลดช่องไฟ/ขนาดตัวอักษรทีละขั้น จนตารางพอดีหน้าต่าง ไม่ต้องเลื่อนขึ้นลง
function fitOsOffice(){
  const m=$('brn'), bd=$('bbd');
  const steps=[[8,14],[7,14],[6,13],[5,13],[4,12],[3,12],[3,11],[2,11],[2,10],[1,10]];
  for(const [py,fs] of steps){
    m.style.setProperty('--py',py+'px'); m.style.setProperty('--fs',fs+'px');
    if(bd.scrollHeight<=bd.clientHeight+1&&bd.scrollWidth<=bd.clientWidth+1) break;
  }
}
window.addEventListener('resize',()=>{const m=$('brn'); if(m.classList.contains('os')&&m.style.display!=='none')fitOsOffice();});

$('bx').onclick=()=>{closeBrs();$('brn').style.display='none';};
$('brn').onclick=e=>{if(e.target===$('brn')){closeBrs();$('brn').style.display='none';}};
</script>
<script>
// มือถือ (≤640px): ย้าย Refresh / Reset All / ข้อมูลสาขา / OS-MS Office / สถิติ เข้าเมนูสไลด์ขวา
// iPad แนวตั้ง: ย้ายทุกอย่างในแถบซ้าย (ค้นหา/เลือกตามสาขา/Filter/Save/ประวัติ/Print/Refresh/Reset/ข้อมูลสาขา/OS-MS/สถิติ) เข้าปุ่มรวม Menu กดแล้วขยาย
// จอใหญ่/แนวนอน: อยู่ที่เดิม
(function(){
  var mq=window.matchMedia('(max-width:640px)'),ip=window.matchMedia('(min-width:641px) and (orientation:portrait)');
  var drw=document.getElementById('drw'),drb=document.getElementById('drb'),mx=document.getElementById('mx'),mtg=document.getElementById('mtg'),modes=document.querySelector('.modes');
  var isIpad=document.documentElement.classList.contains('ipad'),items=[];
  function reg(el,tg){if(!el)return;var ph=document.createComment('ph');el.parentNode.insertBefore(ph,el);items.push({el:el,ph:ph,tg:tg});}
  ['m2','m1','m3'].forEach(function(i){reg(document.getElementById(i),'ipad');});
  reg(document.getElementById('savebox'),'ipad');
  reg(document.getElementById('rf'),'both');
  reg(document.getElementById('rs'),'both');
  reg(document.querySelector('.sidew'),'both');
  function place(){
    var to=null;
    if(mq.matches)to='d'; else if(isIpad&&ip.matches)to='x';
    items.forEach(function(o){
      if(to==='d'&&o.tg==='both')drb.appendChild(o.el);
      else if(to==='x')mx.appendChild(o.el);
      else o.ph.parentNode.insertBefore(o.el,o.ph.nextSibling);
    });
    if(to!=='d')closeD();
    if(to!=='x'){modes.classList.remove('mxo');mtg.textContent='HOME ▾';}
  }
  function openD(){drw.classList.add('on');}
  function closeD(){drw.classList.remove('on');}
  document.getElementById('mnu').onclick=openD;
  document.getElementById('drx').onclick=closeD;
  document.getElementById('drk').onclick=closeD;
  drb.addEventListener('click',function(e){if(e.target.closest('button'))setTimeout(closeD,0);});
  mx.addEventListener('click',function(e){if(e.target.closest('button'))setTimeout(function(){modes.classList.remove('mxo');mtg.textContent='HOME ▾';},0);});
  mtg.onclick=function(){var o=modes.classList.toggle('mxo');mtg.textContent=o?'HOME ▴':'HOME ▾';};
  [mq,ip].forEach(function(m){if(m.addEventListener)m.addEventListener('change',place);else m.addListener(place);});
  place();
})();
</script>
